; =====================================================================================
; SmedbyCharger_v2.2.ini – genererad 2026-10-24 av build_ini.py. MALSPECIFIKATION (FORSLAG) med AUTOLAGE.
; Fungerar INTE mot dagens firmware: kraver ny firmware med signature "MSII s-Charger 2.2  ".
; Signaturen ar hojd fran 2.1 till 2.2 eftersom LAYOUTEN andras (sida 1 och realtime-blocket).
; INTE testad i riktig TunerStudio – endast statiskt validerad med validate_ini.py + check_preview.py.
;
; Nytt i v2.2 jamfort med v2.1 (Olas beslut 2026-10-24):
;   * Sida 1 i 0,01 A / 0,01 V (U16). 33 -> 38 byte. MaxInputVolt kvar pa offset 4. FIRMWARE-ANDRING (se SPEC_v2.2.md).
;     compat-filerna ar OFORANDRADE och beskriver dagens firmware (hela A/V).
;   * Tempkomp -4 mV/C/cell for alla blytyper (aven GEL/djupcykel), referens 25 C.
;   * bulkMaxTime raknas om fran manuell bulkstrom; float raknas in i totalMaxTime; 15 A tak aven for manuella strommar.
;   * Kalcium/EFB absorption 14,7 V. LiFePO4 = obekraftat forslag. Forval: 12 V vatt startbatteri 60 Ah.
;   * Realtime: ny byte pageRefreshReq + [EventTriggers] triggeredPageRefresh -> TS laser om sidan efter kopieringsknapparna.
; Ovriga sidor <= 255 byte (%o = 1 byte). Protokoll: P<sida> (0..4), V/W/X/B per aktiv sida, A realtime, E<n> kommandon.
; EEPROM: 292 byte totalt av 1024 (ATmega328P).
; =====================================================================================
; -------------------------------------------------------------------------------------
; tunerStudio_v2.2.ini i repot SimpleChargerBeta1 (LTT-Sweden AB), 2026-10-25.
; Utgangspunkt: SmedbyCharger_v2.2.ini (Drive, 2026-10-24). Andringar for firmware v2.2:
;   * ochBlockSize 114 -> 115, ny kanal eepromWarnBits pa offset 114 (BESLUT nr 21).
;   * Indikatorer for eepromWarnBits b0..b7.
;   * voltLimit-visning (BESLUT nr 24): MaxChargeVolt = 0 betyder UTGANG AV. Matarna
;     'Hogsta spanning' visar da 0 i stallet for 15,00 V (nya kanaler voltLimitShown/
;     pcVoltLimitShown, ny matare voltLimitNowG) och en rod indikator visas. eff_voltLimit och pa_voltLimit ar
;     oforandrade, sa pa_diffCount jamfor som forut.
;   * restrictionBits b8 = B avvisad under laddning, andringar inte sparade (BESLUT nr 35).
;   * errorBits b12 = bulkAhPct overskriden, egen bit i stallet for b9 (BESLUT nr 36).
;   * restrictionBits b9 = strommgivaren mattad (+-32,767 A), BESLUT nr 37.
; Firmware-tolkning av %o/%c: 1 byte vardera (sidor <= 255 B). Inte testad i riktig TunerStudio.
; Compat-filerna (tunerStudio.ini, SmedbyCharger_compat.ini) ar OFORANDRADE.
; -------------------------------------------------------------------------------------
[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "MSII s-Charger 2.2  "
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.43

[Constants]
   endianness          = little
   nPages              = 5
   pageSize            = 38, 84, 38, 68, 64
   pageActivate        = "P\000", "P\001", "P\002", "P\003", "P\004"
   pageActivationDelay = 10
   burnCommand         = "B", "B", "B", "B", "B"
   pageReadCommand     = "V", "V", "V", "V", "V"
   pageValueWrite      = "W%o%v", "W%o%v", "W%o%v", "W%o%v", "W%o%v"
   pageChunkWrite      = "X%o%c%v", "X%o%c%v", "X%o%c%v", "X%o%c%v", "X%o%c%v"
   blockingFactor      = 64


   ; ---------------- Sida 1: Hardvarugranser (sida 1, 0,01 A/V) (38 byte)  – ANDRAD i v2.2 (0,01 A/V, firmware-andring)
   page = 1
   ; CC-borvarde (0,01 A). 0 = anvand MaxChargeAmp. HEAD: U08 hela A pa offset 0. [FIRMWARE-ANDRING v2.2]
   ChargeAmp              = scalar, U16,   0, "A", 0.01, 0, 0, 15, 2
   ; Overstromsgrans utgang (0,01 A), max 15 A (hardvarutak). Galler aven auto/manuellt. HEAD: U08 hela A pa offset 1. [FIRMWARE-ANDRING v2.2]
   MaxChargeAmp           = scalar, U16,   2, "A", 0.01, 0, 0, 15, 2
   ; Inspanning >= detta = utgang av (0,01 V). 0 = av. Kvar pa offset 4 (HEAD: U08 hela V pa offset 4). Min-inspanning: sida 3. [FIRMWARE-ANDRING v2.2]
   MaxInputVolt           = scalar, U16,   4, "V", 0.01, 0, 0, 65, 2
   ; Maxspanning utgang (0,01 V). 0 = utgang av. HEAD: U08 hela V pa offset 2. [FIRMWARE-ANDRING v2.2]
   MaxChargeVolt          = scalar, U16,   6, "V", 0.01, 0, 0, 55, 2
   ; Max instrom (0,01 A), kraver instromsgivare (inAmpSensor). HEAD: U08 hela A pa offset 3, oanvand. [FIRMWARE-ANDRING v2.2]
   MaxInputAmp            = scalar, U16,   8, "A", 0.01, 0, 0, 30, 2
   ; Duty-tak 0..25 (OCR = steg x 10). Oforandrad typ, ny offset 10 (HEAD 5).
   MaxPWM                 = scalar, U08,  10, "steg", 1, 0, 0, 25, 0
   ; Lagsta on-duty. Oforandrad typ, ny offset 11 (HEAD 6).
   MinPWM                 = scalar, U08,  11, "steg", 1, 0, 0, 25, 0
   ; MOSFET-temp over detta = duty 0. 0 = av. Oforandrad typ, ny offset 12 (HEAD 7).
   MaxTemp                = scalar, U08,  12, "C", 1, 0, 0, 125, 0
   ; Mjukstart per PWM-steg (x10 ms). Ny offset 13 (HEAD 8). [lagras i HEAD men anvands inte – v2 ska anvanda]
   accelerationDelay      = scalar, U08,  13, "x10 ms", 10, 0, 0, 2550, 0
   ; Temp-kurva x-axel (ADC/4). Ny offset 14 (HEAD 9). [lagras i HEAD men anvands inte – v2 ska anvanda]
   mosfetTempADCTable     = array,  U08,  14, [12], "ADC", 1, 0, 0, 255, 0
   ; Temp-kurva y-axel. Ny offset 26 (HEAD 21). [lagras i HEAD men anvands inte – v2 ska anvanda]
   mosfetTempTable        = array,  S08,  26, [12], "C", 1, 0, -40, 127, 0

