[UserDefined]
help = chargingStatesHelp, "Laddsteg s1-s4"
   text = "Stegtabellen anvands bara i chargeMode = Manuell. Med den kor laddaren steg 1 -> 2 -> 3 -> 4. Ett steg avslutas nar NAGOT aktivt villkor uppfylls"
   text = "(U >= endVoltMax, U <= endVoltMin, I >= endAmpMax, I <= endAmpMin, maxtid, Ah-%, batteritemp)"
   text = "men tidigast efter minTime. onEnd bestammer nasta steg. Monitor = utgang av, overvakar spanning."
   text = "Typiskt bly: s1 CC bulk -> s2 CV absorption (slut vid lag strom) -> s3 CV float -> s4 Av."
   text = "Sida 1-granserna (MaxChargeVolt/MaxChargeAmp/MaxTemp) galler ALLTID ovanpa stegen."
help = protectionHelp, "Skydd och deratering"
   text = "Over derateStartTemp sanks strommen enligt derateringskurvan. Over MaxTemp (sida 1) = stopp."
   text = "Efter fel gors faultRetryCount automatiska omstarter med faultRetryDelay s mellanrum."
   text = "Strom-aterstallning: efter en begransning vantar laddaren currentRestoreMs och trappar sedan upp."
help = calibrationHelp, "Kalibrering"
   text = "Matt varde = ravarde x skala + offset. Mat med en kand multimeter och justera skala forst, sedan offset."
   text = "Nolla strommsensorn med utgangen avslagen (knappen Nolla strommsensor)."
help = diagHelp, "Diagnoslage"
   text = "VARNING: Fast duty ger utgang utan reglering av borvarde. V/A/temp-skydd ar fortfarande aktiva."
   text = "Diagnoslaget sparas inte – efter omstart ar laget alltid Normal."

dialog = dlgBasic, "Grundgranser (sida 1, 0,01 A/V - kraver ny firmware)"
