help = autoHelp, "Autolage"
   text = "Auto: ange batterityp, nominell spanning och kapacitet (Ah). Firmware raknar ut alla laddparametrar"
   text = "(strom = C-rate x Ah begransat av taket, spanningar per cell x celler, slutstrom = % x Ah med golv, tider)."
   text = "Vill du andra en enskild parameter: satt dess kalla till Manuell och skriv vardet. Ovriga forblir Auto."
   text = "Mataren till hoger visar det EFFEKTIVA vardet som firmware faktiskt anvander (kraver anslutning)."
   text = "Hardvarugranserna pa sida 1 (MaxChargeVolt/MaxChargeAmp) och voltLimit galler alltid, aven for manuella varden."
   text = "Kopiera-knapparna andrar sidorna i styrkortet. Firmware satter pageRefreshReq ca 1 s och TS laser da om sidan automatiskt"
   text = "([EventTriggers] triggeredPageRefresh). Om falten inte uppdateras: stang och oppna dialogen igen (TS laser om vid oppning)."
   text = "Branna (Burn) sedan som vanligt. Temperaturkompensering -4 mV/C/cell (bly), referens 25 C."

