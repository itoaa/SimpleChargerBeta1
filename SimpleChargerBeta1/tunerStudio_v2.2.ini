   s4_onEnd = "Stage 4: what happens when an end condition is met."
   s4_tempMax = "Stage 4: end if battery temp is above. Not active."
   s4_current = "Stage 4: current (CC setpoint / CV current limit)."
   s4_volt = "Stage 4: voltage (CV setpoint / CC voltage limit)."
   s4_endVoltMax = "Stage 4: end when U >= this value (0 = off)."
   s4_endVoltMin = "Stage 4: end when U <= this value (0 = off)."
   s4_endAmpMax = "Stage 4: end when I >= this value (0 = off)."
   s4_endAmpMin = "Stage 4: end when I <= this value (CV end, 0 = off)."
   s4_maxTime = "Stage 4: max time (0 = unlimited)."
   s4_minTime = "Stage 4: min time before the stage may end."
   s4_tempMin = "Stage 4: end or wait if battery temp is below. Not active."
   s4_endAhPct = "Stage 4: end after this share of the capacity has been charged (0 = off)."
   pwmFreqKHz = "PWM frequency. Not active: the firmware uses a fixed 31 kHz."
   softStartMs = "Soft start time from 0 to setpoint. Not active."
   dutyStepMax = "Max PWM change per control loop. Not active."
   driverVoltMin = "Gate driver voltage below this value = error. Not active. Range 0-16 V."
   driverVoltMax = "Gate driver voltage above this value = error. Not active. Range 0-16 V; the firmware limits stored values to 16.0 V."
   mosfetTempSensor = "MOSFET temperature sensor. Not active."
   batTempSensor = "Battery temperature sensor. Not active."
   currentSensor = "Fitted current sensor type (gives the scale). Takes effect after a controller restart. Shunt + amplifier is not supported."
   ampZeroAtBoot = "Zero the current sensor at boot with the output off."
   inAmpSensor = "Input current sensor fitted? Controls if input power, loss and efficiency are calculated (PC)."
   derateStartTemp = "MOSFET temperature where derating starts. Not active."
   tempHyst = "Hysteresis before restart after over-temperature. Not active."
   minInputVolt = "Input voltage below this value = error (0 = off). Not active."
   currentRestoreMs = "Current restore: delay after a limit before the current ramps up again. Not active."
   currentRestoreStep = "Current restore: PWM steps per ramp step. Not active."
   faultRetryCount = "Number of automatic retries after a fault (0 = always manual). Not active."
   faultRetryDelay = "Delay before an automatic retry. Not active."
   diagMode = "Diagnostics mode. Both diagnostics modes keep the output off. Not saved: always Normal after restart."
   diagDuty = "Fixed duty in diagnostics mode 1. Not active."
   calOutVoltScale = "Calibration of output voltage: scale factor (measured = raw x scale + offset). Not active."
   calOutVoltOffset = "Calibration of output voltage: offset. Not active."
   calInVoltScale = "Calibration of input voltage: scale factor (measured = raw x scale + offset). Not active."
   calInVoltOffset = "Calibration of input voltage: offset. Not active."
   calOutAmpScale = "Calibration of output current: scale factor (measured = raw x scale + offset). Not active."
   calOutAmpOffset = "Calibration of output current: offset. Not active."
   calInAmpScale = "Calibration of input current: scale factor (measured = raw x scale + offset). Not active."
   calInAmpOffset = "Calibration of input current: offset. Not active."
   calDriverScale = "Calibration of driver voltage: scale factor (measured = raw x scale + offset). Not active."
   calDriverOffset = "Calibration of driver voltage: offset. Not active."
   batNtcADC = "Battery NTC curve, x axis: ADC value. Not active."
   batNtcTemp = "Battery NTC curve, y axis: temperature for each ADC point. Not active."
   derateTempBins = "Derating curve, x axis: MOSFET temperature. Not active."
   deratePct = "Derating curve, y axis: allowed current in % of setpoint. Not active."
   ampTimeBins = "Time-current curve, x axis: time over the current limit. Not active."
   ampTimeLimit = "Time-current curve, y axis: allowed current (0-15 A). Not active."
   chargeMode = "Charge mode. Auto = the firmware calculates all parameters from battery type and capacity (each parameter can be set manually). Manual stage table is not active."
   tempCompEnable = "Temperature compensation of absorption and float (ref. 25 °C). Not active: no battery temperature sensor."
   batteryType = "Battery type, selects the row in the type table. Custom = no auto values, all manual values are used."
   batteryNomVolt = "Nominal battery voltage, gives the cell count (lead 2 V/cell, LiFePO4 3.2 V/cell). 6, 12, 24 or 36 V; the output is limited to 55 V."
   capacityAh = "Battery capacity C (20 h rating). The only value that must be set in Auto mode."
   autoAmpCap = "Current cap in Auto. Effective cap = lowest of this value, the 15 A hardware limit, Max charge current and the sensor range."
   tailAmpFloor = "Floor for tail, float and precharge current (ACS712 is uncertain below about 0.5 A)."
   ovr_cellCount = "Source for Cell count: Auto = calculated, Manuell = manual value."
   ovr_bulkAmp = "Source for Bulk current: Auto = calculated, Manuell = manual value."
   ovr_absorbVolt = "Source for Absorption voltage: Auto = calculated, Manuell = manual value."
   ovr_floatVolt = "Source for Float voltage: Auto = calculated, Manuell = manual value."
   ovr_tailAmp = "Source for Tail current: Auto = calculated, Manuell = manual value."
   ovr_floatAmp = "Source for Float current max: Auto = calculated, Manuell = manual value."
   ovr_bulkMaxTime = "Source for Bulk max time: Auto = calculated, Manuell = manual value."
   ovr_bulkAhPct = "Source for Bulk charge limit: Auto = calculated, Manuell = manual value."
   ovr_absorbMaxTime = "Source for Absorption max time: Auto = calculated, Manuell = manual value."
   ovr_absorbMinTime = "Source for Time below tail current: Auto = calculated, Manuell = manual value."
   ovr_floatMaxTime = "Source for Float max time: Auto = calculated, Manuell = manual value."
   ovr_restartVolt = "Source for Restart below: Auto = calculated, Manuell = manual value."
   ovr_tempCompMv = "Source for Temp compensation per cell: Auto = calculated, Manuell = manual value."
   ovr_chargeTempMin = "Source for Charge temp min: Auto = calculated, Manuell = manual value."
   ovr_chargeTempMax = "Source for Charge temp max: Auto = calculated, Manuell = manual value."
   ovr_prechargeVolt = "Source for Precharge below: Auto = calculated, Manuell = manual value."
   ovr_prechargeAmp = "Source for Precharge current: Auto = calculated, Manuell = manual value."
   ovr_prechargeMaxTime = "Source for Precharge max time: Auto = calculated, Manuell = manual value."
   ovr_voltLimit = "Source for Voltage limit: Auto = calculated, Manuell = manual value."
   ovr_totalMaxTime = "Source for Total max time: Auto = calculated, Manuell = manual value."
   ovr_batteryPresentVolt = "Source for Battery detected above: Auto = calculated, Manuell = manual value."
   man_cellCount = "Manual value: Number of cells in series. Used when the source is Manuell or the type is Custom."
   man_bulkAmp = "Manual value: Bulk current (CC) = C-rate x capacity, limited by the cap. Used when the source is Manuell or the type is Custom."
   man_absorbVolt = "Manual value: Absorption voltage at 25 °C. Used when the source is Manuell or the type is Custom."
   man_floatVolt = "Manual value: Float voltage at 25 °C. Used when the source is Manuell or the type is Custom."
   man_tailAmp = "Manual value: Tail current that ends absorption = share of capacity with a floor. 0 = time only. Used when the source is Manuell or the type is Custom."
   man_floatAmp = "Manual value: Max current in float (0.05 C, not above bulk). Used when the source is Manuell or the type is Custom."
   man_bulkMaxTime = "Manual value: Max bulk time (1.2 x C / I). Exceeded = error. Used when the source is Manuell or the type is Custom."
   man_bulkAhPct = "Manual value: Max charge in bulk, % of capacity (0 = off). Exceeded = error. Used when the source is Manuell or the type is Custom."
   man_absorbMaxTime = "Manual value: Max absorption time. Used when the source is Manuell or the type is Custom."
   man_absorbMinTime = "Manual value: The tail current must be held this long. Used when the source is Manuell or the type is Custom."
   man_floatMaxTime = "Manual value: Max float time (0 = unlimited), then Monitor. Used when the source is Manuell or the type is Custom."
   man_restartVolt = "Manual value: Restart from Monitor below this voltage. Used when the source is Manuell or the type is Custom."
   man_tempCompMv = "Manual value: Temperature compensation per cell. Not active: no battery temperature sensor. Used when the source is Manuell or the type is Custom."
   man_chargeTempMin = "Manual value: Charging allowed from this battery temperature. Not active: no sensor. Used when the source is Manuell or the type is Custom."
   man_chargeTempMax = "Manual value: Charging allowed up to this battery temperature. Not active: no sensor. Used when the source is Manuell or the type is Custom."
   man_prechargeVolt = "Manual value: Precharge (low current) below this voltage. Used when the source is Manuell or the type is Custom."
   man_prechargeAmp = "Manual value: Precharge current (0.03 C with floor, not above bulk). Used when the source is Manuell or the type is Custom."
   man_prechargeMaxTime = "Manual value: The precharge voltage must be passed within this time, else error. Used when the source is Manuell or the type is Custom."
   man_voltLimit = "Manual value: Highest allowed output voltage after compensation. Used when the source is Manuell or the type is Custom."
   man_totalMaxTime = "Manual value: Total max time for precharge, bulk, absorption and float (max 10080 min). Used when the source is Manuell or the type is Custom."
   man_batteryPresentVolt = "Manual value: Battery detected above this voltage. Used when the source is Manuell or the type is Custom."

