[OutputChannels]
   ochBlockSize  = 115
   ochGetCommand = "A"

   ; NY: Sekunder sedan start.
   seconds              = scalar, U16,   0, "s", 1, 0
   ; NY: Aktuell duty 0..25.
   pulseWidth           = scalar, U08,   2, "steps", 1, 0
   ; NY: 0 Vantar 1 Timer 2 Mjukstart 3 Laddar 4 Klar 5 Fel 6 Paus(temp) 7 Diagnos.
   chargerState         = scalar, U08,   3, "", 1, 0
   ; NY: Aktivt steg 1-4 (0 = enkel CC/CV).
   stage                = scalar, U08,   4, "", 1, 0
   ; NY: b0 utgang aktiv, b1 CC, b2 CV, b3 deratering, b4 batteri anslutet, b5 diagnos, b6 timer vantar, b7 forladdning.
   statusBits           = scalar, U08,   5, "", 1, 0
   ; NY: Aktiva begransningar: b0 max utstrom, b1 max instrom, b2 hog MOSFET-temp, b3 batteritemp, b4 lag inspanning, b5 max utspanning, b6 PWM-tak, b7 tid-strom. FIRMWARE (BESLUT nr 35): b8 senaste B avvisad (laddning pagick) - andringar inte sparade, nollas av nasta burn. (BESLUT nr 37): b9 strommgivaren mattad +-32,767 A (matvardet klampat). (BESLUT nr 39): b10 stromgivartyp andrad - omstart kravs, start nekas.
   restrictionBits      = scalar, U16,   6, "", 1, 0
   ; NY: Aktiva fel: b0 overspanning ut, b1 overstrom ut, b2 hog inspanning, b3 lag inspanning, b4 MOSFET overtemp, b5 lag drivspanning, b6 hog drivspanning, b7 tempsensorfel, b8 batteritemp utanfor, b9 max laddtid, b10 batteri saknas/omvant, b11 strommsensor-nollfel. FIRMWARE (BESLUT nr 36): b12 max laddad Ah i bulk (bulkAhPct).
   errorBits            = scalar, U16,   8, "", 1, 0
   ; NY: Fel som intraffat sedan senaste "Nollstall fel" (samma bitar).
   latchedErrorBits     = scalar, U16,  10, "", 1, 0
   ; NY: Inspanning.
   inVolt               = scalar, U16,  12, "V", 0.01, 0
   ; NY: Utspanning/batterispanning.
   outVolt              = scalar, U16,  14, "V", 0.01, 0
   ; NY: Instrom (kraver sensor).
   inAmp                = scalar, S16,  16, "A", 0.01, 0
   ; NY: Utstrom.
   outAmp               = scalar, S16,  18, "A", 0.01, 0
   ; NY: MOSFET/kylflans-temp.
   mosfetTemp           = scalar, S16,  20, "°C", 0.1, 0
   ; NY: Batteritemp.
   batTemp              = scalar, S16,  22, "°C", 0.1, 0
   ; NY: Extra tempgivare.
   extraTemp            = scalar, S16,  24, "°C", 0.1, 0
   ; NY: Gate-drivspanning (12 V-skena).
   driverVolt           = scalar, U16,  26, "V", 0.01, 0
   ; NY: Laddade Ah denna laddning.
   ampHours             = scalar, U16,  28, "Ah", 0.01, 0
   ; NY: Laddade Wh denna laddning.
   wattHours            = scalar, U32,  30, "Wh", 0.1, 0
   ; NY: Tid i aktuellt steg.
   stageTime            = scalar, U16,  34, "s", 1, 0
   ; NY: Total laddtid.
   chargeTime           = scalar, U32,  36, "s", 1, 0
   ; NY: Aktuellt spanningsborvarde.
   voltSetpoint         = scalar, U16,  40, "V", 0.01, 0
   ; NY: Aktuellt strommborvarde (efter deratering).
   ampSetpoint          = scalar, U16,  42, "A", 0.01, 0
   ; NY: Aktuell deratering (100 = ingen).
   derateNow            = scalar, U08,  44, "%", 1, 0
   ; NY: Faktisk PWM-frekvens.
   pwmFreqNow           = scalar, U08,  45, "kHz", 1, 0
   ; NY: Ra-ADC MOSFET-temp.
   mosfetTempADC        = scalar, U16,  46, "ADC", 1, 0
   ; NY: Ra-ADC batteri-NTC.
   batTempADC           = scalar, U16,  48, "ADC", 1, 0
   ; NY: Ra-ADC utspanning (diagnos/kalibrering).
   outVoltADC           = scalar, U16,  50, "ADC", 1, 0
   ; NY: Ra-ADC utstrom.
   outAmpADC            = scalar, U16,  52, "ADC", 1, 0
   ; NY: Ra-ADC inspanning.
   inVoltADC            = scalar, U16,  54, "ADC", 1, 0
   ; NY: Ra-ADC instrom.
   inAmpADC             = scalar, U16,  56, "ADC", 1, 0
   ; NY: Ra-ADC drivspanning.
   driverVoltADC        = scalar, U16,  58, "ADC", 1, 0
   ; NY: Tid over kontinuerlig strommgrans (tid-strom-skydd).
   overAmpTime          = scalar, U16,  60, "s", 1, 0
   ; NY: Kvar till tidsstyrd start.
   timerRemaining       = scalar, U16,  62, "s", 1, 0
   ; NY: Reglerloopens tid (diagnos).
   loopTimeUs           = scalar, U16,  64, "us", 1, 0
   ; NY: MCUSR vid start: b0 power-on, b1 extern, b2 brown-out, b3 watchdog.
   resetCause           = scalar, U08,  66, "", 1, 0
   ; NY: Kvarvarande automatiska omstarter.
   retriesLeft          = scalar, U08,  67, "", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Antal celler i serie.
   eff_cellCount        = scalar, U08,  68, "cells", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Laddstrom bulk (CC) = min(C-rate x Ah, tak).
   eff_bulkAmp          = scalar, U16,  69, "A", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Absorptionsspanning vid 25 °C.
   eff_absorbVolt       = scalar, U16,  71, "V", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Floatspanning vid 25 °C.
   eff_floatVolt        = scalar, U16,  73, "V", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Slutstrom absorption = max(% x Ah, golv), 0 = bara tid.
   eff_tailAmp          = scalar, U16,  75, "A", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Max strom i float = 0,05C (<= bulk).
   eff_floatAmp         = scalar, U16,  77, "A", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Max tid bulk (1,2 x C / I), overskridning = FEL.
   eff_bulkMaxTime      = scalar, U16,  79, "min", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Max laddad Ah i bulk, % av C (0 = av).
   eff_bulkAhPct        = scalar, U08,  81, "%", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Max tid absorption.
   eff_absorbMaxTime    = scalar, U16,  82, "min", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Slutstrom maste hallas sa lange.
   eff_absorbMinTime    = scalar, U16,  84, "s", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Max tid float (0 = obegransad), sedan overvakning.
   eff_floatMaxTime     = scalar, U16,  86, "min", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Omstart fran overvakning under denna.
   eff_restartVolt      = scalar, U16,  88, "V", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Temperaturkompensering per cell.
   eff_tempCompMv       = scalar, S08,  90, "mV/°C/cell", 0.1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Laddning tillaten fran.
   eff_chargeTempMin    = scalar, S08,  91, "°C", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Laddning tillaten till.
   eff_chargeTempMax    = scalar, S08,  92, "°C", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Forladdning (lag strom) under denna.
   eff_prechargeVolt    = scalar, U16,  93, "V", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Forladdningsstrom = max(0,03C, golv) <= bulk.
   eff_prechargeAmp     = scalar, U16,  95, "A", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Forladdningsgransen maste passeras inom, annars FEL.
   eff_prechargeMaxTime = scalar, U16,  97, "min", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Hogsta tillatna utspanning efter kompensering.
   eff_voltLimit        = scalar, U16,  99, "V", 0.01, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Total max-tid forladdning+bulk+absorption+float (v2.2: float raknas in, max 10080).
   eff_totalMaxTime     = scalar, U16, 101, "min", 1, 0
   ; NY: EFFEKTIVT varde som firmware anvander: Batteri anslutet over denna.
   eff_batteryPresentVolt = scalar, U16, 103, "V", 0.01, 0
   ; NY: Bit i = parameter i (PARAMS-ordning) tas fran man_* (override eller typ Anpassad).
   effManualMask        = scalar, U32, 105, "", 1, 0
   ; NY: Varningar fran autoberakningen: b0 Kapacitet 0 Ah i Auto - laddning startar inte; b1 Batterityp Anpassad/ogiltig - alla varden tas fran man_*; b2 C-rate x Ah over taket - bulkstrommen begransad; b3 Slutstrom/forladdning/float hojd till golvet (ACS712-upplosning); b4 Spanning begransad av voltLimit / MaxChargeVolt; b5 Ogiltig nominell spanning; b6 Tempkomp pa men batterigivare saknas - ingen kompensering; b7 Inkonsekvent: float>=absorption, slut>=bulk, tMin>=tMax eller restart>=float; b8 Minst en parameter ar manuellt overstyrd; b9 bulkMaxTime begransad till 60..1200 min; b10 floatMaxTime = 0 (obegransad float) - totaltiden skyddar inte float.
   autoWarnBits         = scalar, U16, 109, "", 1, 0
   ; NY: Aktuell temperaturkompensering av borspanningen (0 utan givare).
   tempCompDelta        = scalar, S16, 111, "V", 0.01, 0
   ; NY: Bit n-1 = sida n har andrats AV FIRMWARE (E\x07/E\x08/E\x09). Hall biten 1 i ca 1 s; TS laser da om sidan via [EventTriggers] triggeredPageRefresh.
   pageRefreshReq       = scalar, U08, 113, "", 1, 0
   ; FIRMWARE: EEPROM-varningar (BESLUT nr 21): b0 huvud ogiltigt (alla sidor standard), b1..b5 CRC-fel sida 1..5 (sidan standard), b6 burn misslyckades, b7 ingen EEPROM-backend. Lyckad burn nollar.
   eepromWarnBits       = scalar, U08, 114, "", 1, 0

   ; --- Bitar som egna kanaler (for indikatorer/logg) ---
   st_outOn              = bits, U08, 5, [0:0]
   st_cc                 = bits, U08, 5, [1:1]
   st_cv                 = bits, U08, 5, [2:2]
   st_derate             = bits, U08, 5, [3:3]
   st_batOk              = bits, U08, 5, [4:4]
   st_diag               = bits, U08, 5, [5:5]
   st_timer              = bits, U08, 5, [6:6]
   st_precharge          = bits, U08, 5, [7:7]

   ; --- PC-beraknade formler ---
   outPower     = { outVolt * outAmp }, "W"
   inPower      = { inAmpSensor == 1 ? inVolt * inAmp : 0 }, "W"
   powerLoss    = { (inAmpSensor == 1) && (inPower > 0) ? inPower - outPower : 0 }, "W"
   ; Verkningsgrad visas bara om instromsgivare finns (inAmpSensor, sida 3 bit 7)
   efficiency   = { (inAmpSensor == 1) && (inPower > 1) ? outPower / inPower * 100 : 0 }, "%"
   dutyPct      = { pulseWidth * 10 / 2.55 }, "%"
   socPct       = { capacityAh > 0 ? ampHours / capacityAh * 100 : 0 }, "%"
   cellVolt     = { eff_cellCount > 0 ? outVolt / eff_cellCount : 0 }, "V"
   chargeTimeMin= { chargeTime / 60 }, "min"
   anyError     = { errorBits > 0 }
   anyLatched   = { latchedErrorBits > 0 }

   ; --- AUTOLAGE: PC-forhandsvisning pa_* (samma formler som auto_params.py, flyttal; firmware ar facit = eff_*) ---
   ; Typ >= 6 (Anpassad/INVALID) ger 0. Ternarer anvands i stallet for min()/max().
   pa_typeOk            = { (batteryType < 6) && (batteryNomVolt < 4) }
   pa_cellCount         = { pa_typeOk ? (batteryType == 5 ? (batteryNomVolt == 0 ? 2 : (batteryNomVolt == 1 ? 4 : (batteryNomVolt == 2 ? 8 : (batteryNomVolt == 3 ? 12 : 0)))) : (batteryNomVolt == 0 ? 3 : (batteryNomVolt == 1 ? 6 : (batteryNomVolt == 2 ? 12 : (batteryNomVolt == 3 ? 18 : 0))))) : 0 }, "cells"
   pa_sensMax           = { (currentSensor == 0 ? 5 : (currentSensor == 1 ? 20 : (currentSensor == 2 ? 30 : (currentSensor == 3 ? 999 : 0)))) }, "A"
   pa_hw1               = { (MaxChargeAmp > 0) && (MaxChargeAmp < 15) ? MaxChargeAmp : 15 }, "A"
   pa_hwCap             = { (pa_hw1 < pa_sensMax ? pa_hw1 : pa_sensMax) }, "A"
   pa_ampCap            = { (autoAmpCap < pa_hwCap ? autoAmpCap : pa_hwCap) }, "A"
   pa_bulkRaw           = { (batteryType == 0 ? 0.1 : (batteryType == 1 ? 0.2 : (batteryType == 2 ? 0.1 : (batteryType == 3 ? 0.1 : (batteryType == 4 ? 0.1 : (batteryType == 5 ? 0.5 : 0)))))) * capacityAh }, "A"
   pa_bulkAmp           = { (pa_bulkRaw < pa_ampCap ? pa_bulkRaw : pa_ampCap) }, "A"
   pa_tailRaw           = { (batteryType == 0 ? 0.03 : (batteryType == 1 ? 0.02 : (batteryType == 2 ? 0.015 : (batteryType == 3 ? 0.02 : (batteryType == 4 ? 0.03 : (batteryType == 5 ? 0 : 0)))))) * capacityAh }, "A"
   pa_tailAmp           = { pa_tailRaw <= 0 ? 0 : ((pa_tailRaw > tailAmpFloor ? pa_tailRaw : tailAmpFloor) < pa_bulkAmp ? (pa_tailRaw > tailAmpFloor ? pa_tailRaw : tailAmpFloor) : pa_bulkAmp) }, "A"
   pa_floatRaw          = { (batteryType == 0 ? 0.05 : (batteryType == 1 ? 0.05 : (batteryType == 2 ? 0.05 : (batteryType == 3 ? 0.05 : (batteryType == 4 ? 0.05 : (batteryType == 5 ? 0.05 : 0)))))) * capacityAh }, "A"
   pa_floatAmp          = { ((pa_floatRaw > tailAmpFloor ? pa_floatRaw : tailAmpFloor) < pa_bulkAmp ? (pa_floatRaw > tailAmpFloor ? pa_floatRaw : tailAmpFloor) : pa_bulkAmp) }, "A"
   pa_prechRaw          = { (batteryType == 0 ? 0.03 : (batteryType == 1 ? 0.03 : (batteryType == 2 ? 0.03 : (batteryType == 3 ? 0.03 : (batteryType == 4 ? 0.03 : (batteryType == 5 ? 0.03 : 0)))))) * capacityAh }, "A"
   pa_prechargeAmp      = { ((pa_prechRaw > tailAmpFloor ? pa_prechRaw : tailAmpFloor) < pa_bulkAmp ? (pa_prechRaw > tailAmpFloor ? pa_prechRaw : tailAmpFloor) : pa_bulkAmp) }, "A"
   pa_vLimRaw           = { (batteryType == 0 ? 2.5 : (batteryType == 1 ? 2.5 : (batteryType == 2 ? 2.5 : (batteryType == 3 ? 2.5 : (batteryType == 4 ? 2.5 : (batteryType == 5 ? 3.65 : 0)))))) * pa_cellCount }, "V"
   pa_voltLimit         = { (MaxChargeVolt > 0) && (MaxChargeVolt < pa_vLimRaw) ? MaxChargeVolt : pa_vLimRaw }, "V"
   ; FIRMWARE (BESLUT nr 24): MaxChargeVolt = 0 = utgang av. Visa 0 i matarna i stallet for typens voltLimit.
   mcvOutputOff         = { (MaxChargeVolt == 0) ? 1 : 0 }
   voltLimitShown       = { (MaxChargeVolt == 0) ? 0 : eff_voltLimit }, "V"
   pcVoltLimitShown     = { (MaxChargeVolt == 0) ? 0 : pa_voltLimit }, "V"
   pa_absRaw            = { (batteryType == 0 ? 2.45 : (batteryType == 1 ? 2.4 : (batteryType == 2 ? 2.375 : (batteryType == 3 ? 2.45 : (batteryType == 4 ? 2.45 : (batteryType == 5 ? 3.55 : 0)))))) * pa_cellCount }, "V"
   pa_absorbVolt        = { (pa_absRaw < pa_voltLimit ? pa_absRaw : pa_voltLimit) }, "V"
   pa_floatRawV         = { (batteryType == 0 ? 2.25 : (batteryType == 1 ? 2.2667 : (batteryType == 2 ? 2.2833 : (batteryType == 3 ? 2.25 : (batteryType == 4 ? 2.25 : (batteryType == 5 ? 3.375 : 0)))))) * pa_cellCount }, "V"
   pa_floatVolt         = { (pa_floatRawV < pa_voltLimit ? pa_floatRawV : pa_voltLimit) }, "V"
   pa_restartVolt       = { (batteryType == 0 ? 2.0833 : (batteryType == 1 ? 2.0833 : (batteryType == 2 ? 2.0833 : (batteryType == 3 ? 2.0833 : (batteryType == 4 ? 2.0833 : (batteryType == 5 ? 3.3 : 0)))))) * pa_cellCount }, "V"
   pa_prechargeVolt     = { (batteryType == 0 ? 1.75 : (batteryType == 1 ? 1.75 : (batteryType == 2 ? 1.75 : (batteryType == 3 ? 1.75 : (batteryType == 4 ? 1.75 : (batteryType == 5 ? 2.5 : 0)))))) * pa_cellCount }, "V"
   pa_batteryPresentVolt = { (batteryType == 0 ? 0.5 : (batteryType == 1 ? 0.5 : (batteryType == 2 ? 0.5 : (batteryType == 3 ? 0.5 : (batteryType == 4 ? 0.5 : (batteryType == 5 ? 0.5 : 0)))))) * pa_cellCount }, "V"
   ; v2.2: bulktiden foljer den EFFEKTIVA bulkstrommen (manuell, klampad till hardvarutaket)
   pa_bulkSrc           = { ovr_bulkAmp == 1 ? (man_bulkAmp < pa_hwCap ? man_bulkAmp : pa_hwCap) : pa_bulkAmp }, "A"
   pa_bulkTimeRaw       = { pa_bulkSrc > 0 ? 72 * capacityAh / pa_bulkSrc : 1200 }, "min"
   pa_bulkMaxTime       = { pa_typeOk ? (pa_bulkTimeRaw < 60 ? 60 : (pa_bulkTimeRaw > 1200 ? 1200 : pa_bulkTimeRaw)) : 0 }, "min"
   pa_bulkAhPct         = { pa_typeOk ? 120 : 0 }, "%"
   pa_absorbMaxTime     = { (batteryType == 0 ? 240 : (batteryType == 1 ? 240 : (batteryType == 2 ? 240 : (batteryType == 3 ? 240 : (batteryType == 4 ? 240 : (batteryType == 5 ? 120 : 0)))))) }, "min"
   pa_absorbMinTime     = { pa_typeOk ? 60 : 0 }, "s"
   pa_floatMaxTime      = { (batteryType == 0 ? 2880 : (batteryType == 1 ? 1440 : (batteryType == 2 ? 1440 : (batteryType == 3 ? 1440 : (batteryType == 4 ? 1440 : (batteryType == 5 ? 1440 : 0)))))) }, "min"
   pa_tempCompMv        = { (batteryType == 0 ? -4 : (batteryType == 1 ? -4 : (batteryType == 2 ? -4 : (batteryType == 3 ? -4 : (batteryType == 4 ? -4 : (batteryType == 5 ? 0 : 0)))))) }, "mV/°C/cell"
   pa_chargeTempMin     = { (batteryType == 0 ? 0 : (batteryType == 1 ? 0 : (batteryType == 2 ? 0 : (batteryType == 3 ? 0 : (batteryType == 4 ? 0 : (batteryType == 5 ? 5 : 0)))))) }, "°C"
   pa_chargeTempMax     = { (batteryType == 0 ? 45 : (batteryType == 1 ? 45 : (batteryType == 2 ? 45 : (batteryType == 3 ? 45 : (batteryType == 4 ? 45 : (batteryType == 5 ? 50 : 0)))))) }, "°C"
   pa_prechargeMaxTime  = { pa_typeOk ? 120 : 0 }, "min"
   ; v2.2: total = forladdning + bulk + absorption + float (effektiva kallor), max 10080 min
   pa_totalRaw          = { (ovr_prechargeMaxTime == 1 ? man_prechargeMaxTime : pa_prechargeMaxTime) + (ovr_bulkMaxTime == 1 ? man_bulkMaxTime : pa_bulkMaxTime) + (ovr_absorbMaxTime == 1 ? man_absorbMaxTime : pa_absorbMaxTime) + (ovr_floatMaxTime == 1 ? man_floatMaxTime : pa_floatMaxTime) }, "min"
   pa_totalMaxTime      = { pa_typeOk ? (pa_totalRaw > 10080 ? 10080 : pa_totalRaw) : 0 }, "min"
   pa_diffCount         = { (chargeMode == 0) && pa_typeOk ? (((ovr_cellCount == 0) && ((eff_cellCount - pa_cellCount > 0.5) || (pa_cellCount - eff_cellCount > 0.5)) ? 1 : 0) + ((ovr_bulkAmp == 0) && ((eff_bulkAmp - pa_bulkAmp > 0.02) || (pa_bulkAmp - eff_bulkAmp > 0.02)) ? 1 : 0) + ((ovr_absorbVolt == 0) && ((eff_absorbVolt - pa_absorbVolt > 0.02) || (pa_absorbVolt - eff_absorbVolt > 0.02)) ? 1 : 0) + ((ovr_floatVolt == 0) && ((eff_floatVolt - pa_floatVolt > 0.02) || (pa_floatVolt - eff_floatVolt > 0.02)) ? 1 : 0) + ((ovr_tailAmp == 0) && ((eff_tailAmp - pa_tailAmp > 0.02) || (pa_tailAmp - eff_tailAmp > 0.02)) ? 1 : 0) + ((ovr_floatAmp == 0) && ((eff_floatAmp - pa_floatAmp > 0.02) || (pa_floatAmp - eff_floatAmp > 0.02)) ? 1 : 0) + ((ovr_bulkMaxTime == 0) && ((eff_bulkMaxTime - pa_bulkMaxTime > 1.5) || (pa_bulkMaxTime - eff_bulkMaxTime > 1.5)) ? 1 : 0) + ((ovr_bulkAhPct == 0) && ((eff_bulkAhPct - pa_bulkAhPct > 0.5) || (pa_bulkAhPct - eff_bulkAhPct > 0.5)) ? 1 : 0) + ((ovr_absorbMaxTime == 0) && ((eff_absorbMaxTime - pa_absorbMaxTime > 1.5) || (pa_absorbMaxTime - eff_absorbMaxTime > 1.5)) ? 1 : 0) + ((ovr_absorbMinTime == 0) && ((eff_absorbMinTime - pa_absorbMinTime > 0.5) || (pa_absorbMinTime - eff_absorbMinTime > 0.5)) ? 1 : 0) + ((ovr_floatMaxTime == 0) && ((eff_floatMaxTime - pa_floatMaxTime > 1.5) || (pa_floatMaxTime - eff_floatMaxTime > 1.5)) ? 1 : 0) + ((ovr_restartVolt == 0) && ((eff_restartVolt - pa_restartVolt > 0.02) || (pa_restartVolt - eff_restartVolt > 0.02)) ? 1 : 0) + ((ovr_tempCompMv == 0) && ((eff_tempCompMv - pa_tempCompMv > 0.05) || (pa_tempCompMv - eff_tempCompMv > 0.05)) ? 1 : 0) + ((ovr_chargeTempMin == 0) && ((eff_chargeTempMin - pa_chargeTempMin > 0.5) || (pa_chargeTempMin - eff_chargeTempMin > 0.5)) ? 1 : 0) + ((ovr_chargeTempMax == 0) && ((eff_chargeTempMax - pa_chargeTempMax > 0.5) || (pa_chargeTempMax - eff_chargeTempMax > 0.5)) ? 1 : 0) + ((ovr_prechargeVolt == 0) && ((eff_prechargeVolt - pa_prechargeVolt > 0.02) || (pa_prechargeVolt - eff_prechargeVolt > 0.02)) ? 1 : 0) + ((ovr_prechargeAmp == 0) && ((eff_prechargeAmp - pa_prechargeAmp > 0.02) || (pa_prechargeAmp - eff_prechargeAmp > 0.02)) ? 1 : 0) + ((ovr_prechargeMaxTime == 0) && ((eff_prechargeMaxTime - pa_prechargeMaxTime > 1.5) || (pa_prechargeMaxTime - eff_prechargeMaxTime > 1.5)) ? 1 : 0) + ((ovr_voltLimit == 0) && ((eff_voltLimit - pa_voltLimit > 0.02) || (pa_voltLimit - eff_voltLimit > 0.02)) ? 1 : 0) + ((ovr_totalMaxTime == 0) && ((eff_totalMaxTime - pa_totalMaxTime > 1.5) || (pa_totalMaxTime - eff_totalMaxTime > 1.5)) ? 1 : 0) + ((ovr_batteryPresentVolt == 0) && ((eff_batteryPresentVolt - pa_batteryPresentVolt > 0.02) || (pa_batteryPresentVolt - eff_batteryPresentVolt > 0.02)) ? 1 : 0)) : 0 }
   effAbsorbNow         = { eff_absorbVolt + tempCompDelta }, "V"
   effFloatNow          = { eff_floatVolt + tempCompDelta }, "V"

