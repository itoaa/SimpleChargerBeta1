dialog = dlgHelp_safetyHelp, "Safety"
   topicHelp = safetyHelp
   field = "The hardware limit is 15 A. All current fields are limited to 0-15 A and"
   field = "the firmware limits every effective current to 15 A."
   field = ""
   field = "Max charge voltage = 0 means that the output is always off. This is the"
   field = "factory default. Set Max charge voltage before charging."
   field = ""
   field = "There are no temperature sensors in this firmware. All temperature"
   field = "protection is marked (not active) and does not protect the battery or"
   field = "the MOSFETs. 125 °C (Max MOSFET temp) is the MOSFET junction limit Tj"
   field = "max, not an active protection."
   field = ""
   field = "Until temperature sensors exist, cooling and the total max charge time"
   field = "(totalMaxTime) are the only protection. Do not leave the charger"
   field = "unattended."
   field = ""
   field = "Check all voltages, currents and times against the battery data sheet"
   field = "before charging."
   field = ""
   field = "Burn is rejected while charging. Stop charging first, then burn."

dialog = dlgHelp_accelerationDelayHelp, "Soft start (acceleration delay)"
   topicHelp = accelerationDelayHelp
   field = "Not active: the value is stored but the firmware does not use it yet."
   field = ""
   field = "Planned function: the PWM duty changes one step at a time so that start"
   field = "and ramp-down are smooth. Acceleration delay is the waiting time before"
   field = "each new PWM step up. 0 = no extra waiting."
   field = ""
   field = "A higher value gives a softer start but slower regulation."

dialog = dlgHelp_chargingStatesHelp, "Charging stages 1-4 (manual stage table)"
   topicHelp = chargingStatesHelp
   field = "Note: the stage table is only used when Charge mode = Manual stage"
   field = "table. That mode is not implemented in the firmware yet and the charger"
   field = "does not start in that mode."
   field = ""
   field = "The charger runs stage 1, 2, 3 and 4. On end decides if it goes to the"
   field = "next stage, starts again at stage 1 or stops."
   field = ""
   field = "Methods: Constant current (CC), Constant voltage (CV), Monitor (output"
   field = "off, the voltage is watched) and Off (the stage is skipped)."
   field = ""
   field = "A stage ends when any active end condition is met (0 = condition off),"
   field = "but not before Min time."
   field = ""
   field = "Example: stage 1 CC 9.00 A, end when U >= 14.40 V. The charger charges"
   field = "at 9 A until the voltage reaches 14.40 V and then goes to stage 2."
   field = ""
   field = "The charger max values (Max charge current, Max charge voltage) and the"
   field = "15 A hardware limit always apply on top of the stages."
   field = ""
   field = "Copy effective values to stage table (Auto mode - battery) fills the"
   field = "table from the effective auto values."

dialog = dlgHelp_autoHelp, "Auto mode"
   topicHelp = autoHelp
   field = "Set battery type, nominal voltage and capacity. The firmware calculates"
   field = "all charge parameters: current = C-rate x capacity limited by the"
   field = "current cap, voltages per cell x cell count, tail current = share of"
   field = "capacity with a floor, and the times."
   field = ""
   field = "To change one parameter, set its source to Manuell (manual) and enter"
   field = "the value. The other parameters stay Auto."
   field = ""
   field = "The gauges on the right show the effective value that the firmware uses."
   field = "They need a connection."
   field = ""
   field = "Max charge voltage, Max charge current and the voltage limit always"
   field = "apply, also to manual values."
   field = ""
   field = "Absorption and float voltages are given at 25 °C. Temperature"
   field = "compensation is not active because there is no battery temperature"
   field = "sensor."
   field = ""
   field = "The copy buttons change the pages in the controller. TunerStudio should"
   field = "then reload the page. If the fields do not update, close and open the"
   field = "dialog again. Burn afterwards as usual."
   field = ""
   field = "Preview (PC) is calculated by TunerStudio. The effective values from the"
   field = "firmware are the reference."

dialog = dlgHelp_protectionHelp, "Protection"
   topicHelp = protectionHelp
   field = "Active in this firmware: output over-voltage (Max charge voltage),"
   field = "output over-current (Max charge current and the 15 A hardware limit),"
   field = "high input voltage (Max input voltage) and, in Auto mode, the max times"
   field = "and the bulk charge limit."
   field = ""
   field = "Not active (stored only): MOSFET temperature stop and derating,"
   field = "temperature hysteresis, min input voltage, current restore, automatic"
   field = "retries after a fault, time-current protection and min/max driver"
   field = "voltage."

dialog = dlgHelp_calibrationHelp, "Sensors and calibration"
   topicHelp = calibrationHelp
   field = "Current sensor: select the ACS712 type that is fitted. A change takes"
   field = "effect after a controller restart. Until then the charger does not"
   field = "start."
   field = ""
   field = "Shunt + amplifier is not supported. The firmware then uses its built-in"
   field = "sensor type."
   field = ""
   field = "Zero current sensor at boot: the output is off while the sensor is"
   field = "zeroed. The Zero current sensor button does the same with the output"
   field = "off."
   field = ""
   field = "Not active (stored only): scale and offset calibration and the"
   field = "temperature sensors."

dialog = dlgHelp_diagHelp, "Diagnostics"
   topicHelp = diagHelp
   field = "Both diagnostics modes keep the output off in this firmware. Fixed duty"
   field = "is not active."
   field = ""
   field = "Diagnostics mode is not saved. After a restart the mode is always"
   field = "Normal."
   field = ""
   field = "Clear errors acknowledges the errors (Error state goes back to Waiting)."
   field = "Reset counters clears the shown Ah, Wh and charge time, not the"
   field = "protection time. Restart controller and Zero current sensor are refused"
   field = "while charging."

[ControllerCommands]
   ; NY (forslag): kraver firmwarestod for kommando E. Andrar inte mappade konstanter.
   cmdStart         = "E\x01"
   cmdStop          = "E\x02"
   cmdResetCounters = "E\x03"
   cmdClearErrors   = "E\x04"
   cmdReboot        = "E\x05"
   cmdZeroAmp       = "E\x06"
   ; Autolage. Skriver i sidornas RAM och satter pageRefreshReq -> TS laser om sidan ([EventTriggers], se SPEC_v2.2.md).
   cmdCopyAutoToMan = "E\x07"
   cmdCopyEffToStages = "E\x08"
   cmdAllAuto       = "E\x09"

[EventTriggers]
   ; v2.2: firmware satter pageRefreshReq bit (sida-1) i ca 1 s nar den sjalv har skrivit en sida
   ; (E\x07 -> sida 5, E\x08 -> sida 2, E\x09 -> sida 5). TS laser da om sidan. Samma modell som rusEFI/Speeduino.
   ; EJ TESTAT i TunerStudio av oss. Reserv: stang/oppna dialogen (refreshLocalStoreOnActivity, standard pa).
   triggeredPageRefresh = 1, { (pageRefreshReq & 1) > 0 }
   triggeredPageRefresh = 2, { (pageRefreshReq & 2) > 0 }
   triggeredPageRefresh = 3, { (pageRefreshReq & 4) > 0 }
   triggeredPageRefresh = 4, { (pageRefreshReq & 8) > 0 }
   triggeredPageRefresh = 5, { (pageRefreshReq & 16) > 0 }

