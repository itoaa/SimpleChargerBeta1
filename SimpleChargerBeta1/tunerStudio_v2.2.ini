[ControllerCommands]
   ; NY (forslag): kraver firmwarestod for kommando E. Andrar inte mappade konstanter.
   cmdStart         = "E\x01"
   cmdStop          = "E\x02"
   cmdResetCounters = "E\x03"
   cmdClearErrors   = "E\x04"
   cmdReboot        = "E\x05"
   cmdZeroAmp       = "E\x06"
   ; Autolage. Skriver i sidornas RAM och satter pageRefreshReq -> TS laser om sidan ([EventTriggers], se SPEC_v2.2.md).
   cmdCopyAutoToMan = "E\x07"
   cmdCopyEffToStages = "E\x08"
   cmdAllAuto       = "E\x09"

[EventTriggers]
   ; v2.2: firmware satter pageRefreshReq bit (sida-1) i ca 1 s nar den sjalv har skrivit en sida
   ; (E\x07 -> sida 5, E\x08 -> sida 2, E\x09 -> sida 5). TS laser da om sidan. Samma modell som rusEFI/Speeduino.
   ; EJ TESTAT i TunerStudio av oss. Reserv: stang/oppna dialogen (refreshLocalStoreOnActivity, standard pa).
   triggeredPageRefresh = 1, { (pageRefreshReq & 1) > 0 }
   triggeredPageRefresh = 2, { (pageRefreshReq & 2) > 0 }
   triggeredPageRefresh = 3, { (pageRefreshReq & 4) > 0 }
   triggeredPageRefresh = 4, { (pageRefreshReq & 8) > 0 }
   triggeredPageRefresh = 5, { (pageRefreshReq & 16) > 0 }

