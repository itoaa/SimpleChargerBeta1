[UserDefined]
help = safetyHelp, "Safety"
   text = "The hardware limit is 15 A. All current fields are limited to 0-15 A and the firmware limits every effective current to 15 A.<br>"
   text = "Max charge voltage = 0 means that the output is always off. This is the factory default. Set Max charge voltage before charging.<br>"
   text = "There are no temperature sensors in this firmware. All temperature protection is marked (not active) and does not protect the battery or the MOSFETs. 125 °C (Max MOSFET temp) is the MOSFET junction limit Tj max, not an active protection.<br>"
   text = "Until temperature sensors exist, cooling and the total max charge time (totalMaxTime) are the only protection. Do not leave the charger unattended.<br>"
   text = "Check all voltages, currents and times against the battery data sheet before charging.<br>"
   text = "Burn is rejected while charging. Stop charging first, then burn."
help = accelerationDelayHelp, "Soft start (acceleration delay)"
   text = "Not active: the value is stored but the firmware does not use it yet.<br>"
   text = "Planned function: the PWM duty changes one step at a time so that start and ramp-down are smooth. Acceleration delay is the waiting time before each new PWM step up. 0 = no extra waiting.<br>"
   text = "A higher value gives a softer start but slower regulation."
help = chargingStatesHelp, "Charging stages 1-4 (manual stage table)"
   text = "Note: the stage table is only used when Charge mode = Manual stage table. That mode is not implemented in the firmware yet and the charger does not start in that mode.<br>"
   text = "The charger runs stage 1, 2, 3 and 4. On end decides if it goes to the next stage, starts again at stage 1 or stops.<br>"
   text = "Methods: Constant current (CC), Constant voltage (CV), Monitor (output off, the voltage is watched) and Off (the stage is skipped).<br>"
   text = "A stage ends when any active end condition is met (0 = condition off), but not before Min time.<br>"
   text = "Example: stage 1 CC 9.00 A, end when U >= 14.40 V. The charger charges at 9 A until the voltage reaches 14.40 V and then goes to stage 2.<br>"
   text = "The charger max values (Max charge current, Max charge voltage) and the 15 A hardware limit always apply on top of the stages.<br>"
   text = "Copy effective values to stage table (Auto mode - battery) fills the table from the effective auto values."
help = autoHelp, "Auto mode"
   text = "Set battery type, nominal voltage and capacity. The firmware calculates all charge parameters: current = C-rate x capacity limited by the current cap, voltages per cell x cell count, tail current = share of capacity with a floor, and the times.<br>"
   text = "To change one parameter, set its source to Manuell (manual) and enter the value. The other parameters stay Auto.<br>"
   text = "The gauges on the right show the effective value that the firmware uses. They need a connection.<br>"
   text = "Max charge voltage, Max charge current and the voltage limit always apply, also to manual values.<br>"
   text = "Absorption and float voltages are given at 25 °C. Temperature compensation is not active because there is no battery temperature sensor.<br>"
   text = "The copy buttons change the pages in the controller. TunerStudio should then reload the page. If the fields do not update, close and open the dialog again. Burn afterwards as usual.<br>"
   text = "Preview (PC) is calculated by TunerStudio. The effective values from the firmware are the reference."
help = protectionHelp, "Protection"
   text = "Active in this firmware: output over-voltage (Max charge voltage), output over-current (Max charge current and the 15 A hardware limit), high input voltage (Max input voltage) and, in Auto mode, the max times and the bulk charge limit.<br>"
   text = "Not active (stored only): MOSFET temperature stop and derating, temperature hysteresis, min input voltage, current restore, automatic retries after a fault, time-current protection and min/max driver voltage."
help = calibrationHelp, "Sensors and calibration"
   text = "Current sensor: select the ACS712 type that is fitted. A change takes effect after a controller restart. Until then the charger does not start.<br>"
   text = "Shunt + amplifier is not supported. The firmware then uses its built-in sensor type.<br>"
   text = "Zero current sensor at boot: the output is off while the sensor is zeroed. The Zero current sensor button does the same with the output off.<br>"
   text = "Not active (stored only): scale and offset calibration and the temperature sensors."
help = diagHelp, "Diagnostics"
   text = "Both diagnostics modes keep the output off in this firmware. Fixed duty is not active.<br>"
   text = "Diagnostics mode is not saved. After a restart the mode is always Normal.<br>"
   text = "Clear errors acknowledges the errors (Error state goes back to Waiting). Reset counters clears the shown Ah, Wh and charge time, not the protection time. Restart controller and Zero current sensor are refused while charging."

