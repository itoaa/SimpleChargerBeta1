; =====================================================================================
; SmedbyCharger_v2.2.ini - genererad 2026-10-24 av build_ini.py. MALSPECIFIKATION (FORSLAG) med AUTOLAGE.
; Fungerar INTE mot dagens firmware: kraver ny firmware med signature "MSII s-Charger 2.2  ".
; Signaturen ar hojd fran 2.1 till 2.2 eftersom LAYOUTEN andras (sida 1 och realtime-blocket).
; INTE testad i riktig TunerStudio - endast statiskt validerad med validate_ini.py + check_preview.py.
;
; Nytt i v2.2 jamfort med v2.1 (Olas beslut 2026-10-24):
;   * Sida 1 i 0,01 A / 0,01 V (U16). 33 -> 38 byte. MaxInputVolt kvar pa offset 4. FIRMWARE-ANDRING (se SPEC_v2.2.md).
;     compat-filerna ar OFORANDRADE och beskriver dagens firmware (hela A/V).
;   * Tempkomp -4 mV/C/cell for alla blytyper (aven GEL/djupcykel), referens 25 C.
;   * bulkMaxTime raknas om fran manuell bulkstrom; float raknas in i totalMaxTime; 15 A tak aven for manuella strommar.
;   * Kalcium/EFB absorption 14,7 V. LiFePO4 = obekraftat forslag. Forval: 12 V vatt startbatteri 60 Ah.
;   * Realtime: ny byte pageRefreshReq + [EventTriggers] triggeredPageRefresh -> TS laser om sidan efter kopieringsknapparna.
; Ovriga sidor <= 255 byte (%o = 1 byte). Protokoll: P<sida> (0..4), V/W/X/B per aktiv sida, A realtime, E<n> kommandon.
; EEPROM: 292 byte totalt av 1024 (ATmega328P).
; =====================================================================================
; -------------------------------------------------------------------------------------
; tunerStudio_v2.2.ini i repot SimpleChargerBeta1 (LTT-Sweden AB), 2026-10-25.
; Utgangspunkt: SmedbyCharger_v2.2.ini (Drive, 2026-10-24). Andringar for firmware v2.2:
;   * ochBlockSize 114 -> 115, ny kanal eepromWarnBits pa offset 114 (BESLUT nr 21).
;   * Indikatorer for eepromWarnBits b0..b7.
;   * voltLimit-visning (BESLUT nr 24): MaxChargeVolt = 0 betyder UTGANG AV. Matarna
;     'Hogsta spanning' visar da 0 i stallet for 15,00 V (nya kanaler voltLimitShown/
;     pcVoltLimitShown, ny matare voltLimitNowG) och en rod indikator visas. eff_voltLimit och pa_voltLimit ar
;     oforandrade, sa pa_diffCount jamfor som forut.
;   * restrictionBits b8 = B avvisad under laddning, andringar inte sparade (BESLUT nr 35).
;   * errorBits b12 = bulkAhPct overskriden, egen bit i stallet for b9 (BESLUT nr 36).
;   * restrictionBits b9 = strommgivaren mattad (+-32,767 A), BESLUT nr 37.
;   * restrictionBits b10 = currentSensor andrad, omstart (E5) kravs, ingen start, BESLUT nr 39.
;   * E8 (Kopiera effektiva -> stegtabell s1-s4): s1 bulk, s2 absorption, s3 float, s4 overvaka;
;     forladdning foljer inte med; ignoreras vid AH_MISSING/NOMV_INVALID; ingen burn (BESLUT nr 40).
;   * Strom 0..15 A i alla stromfalt och matare (BESLUT nr 42), spanning 0..55 V och
;     driverVolt 0..16 V (BESLUT nr 43, 46; hamtas ur shared/hwLimits.hpp).
;   * Spanningstak 55 V ut / 65 V in (BESLUT nr 45): ini-max for spanningsfalten hamtas ur
;     shared/hwLimits.hpp (HwVoltMaxCv). Autolaget erbjuder 6/12/24/36 V; index 4..7 ogiltiga.
;   * Presentation (BESLUT nr 44, tools/ini22_ui.py): engelska texter, en teckenkodning
;     (ISO-8859-1, bara ASCII + grad-tecknet), framsida med 8 matare + 12 indikatorer,
;     ovriga indikatorer som indicatorTemplate, hjalptexter med <br>, Help-meny och
;     std_realtime. Funktioner som inte finns i firmware ar markta (not active).
; Firmware-tolkning av %o/%c: 1 byte vardera (sidor <= 255 B). Inte testad i riktig TunerStudio.
; Compat-filerna (tunerStudio.ini, SmedbyCharger_compat.ini) ar OFORANDRADE.
; -------------------------------------------------------------------------------------
[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "MSII s-Charger 2.2  "
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.43

[Constants]
   endianness          = little
   nPages              = 5
   pageSize            = 38, 84, 38, 68, 64
   pageActivate        = "P\000", "P\001", "P\002", "P\003", "P\004"
   pageActivationDelay = 10
   burnCommand         = "B", "B", "B", "B", "B"
   pageReadCommand     = "V", "V", "V", "V", "V"
   pageValueWrite      = "W%o%v", "W%o%v", "W%o%v", "W%o%v", "W%o%v"
   pageChunkWrite      = "X%o%c%v", "X%o%c%v", "X%o%c%v", "X%o%c%v", "X%o%c%v"
   blockingFactor      = 64


   ; ---------------- Sida 1: Hardvarugranser (sida 1, 0,01 A/V) (38 byte)  - ANDRAD i v2.2 (0,01 A/V, firmware-andring)
   page = 1
   ; CC-borvarde (0,01 A). 0 = anvand MaxChargeAmp. HEAD: U08 hela A pa offset 0. [FIRMWARE-ANDRING v2.2]
   ChargeAmp              = scalar, U16,   0, "A", 0.01, 0, 0, 15, 2
   ; Overstromsgrans utgang (0,01 A), max 15 A (hardvarutak). Galler aven auto/manuellt. HEAD: U08 hela A pa offset 1. [FIRMWARE-ANDRING v2.2]
   MaxChargeAmp           = scalar, U16,   2, "A", 0.01, 0, 0, 15, 2
   ; Inspanning >= detta = utgang av (0,01 V). 0 = av. Kvar pa offset 4 (HEAD: U08 hela V pa offset 4). Min-inspanning: sida 3. [FIRMWARE-ANDRING v2.2]
   MaxInputVolt           = scalar, U16,   4, "V", 0.01, 0, 0, 65, 2
   ; Maxspanning utgang (0,01 V). 0 = utgang av. HEAD: U08 hela V pa offset 2. [FIRMWARE-ANDRING v2.2]
   MaxChargeVolt          = scalar, U16,   6, "V", 0.01, 0, 0, 55, 2
   ; Max instrom (0,01 A), kraver instromsgivare (inAmpSensor). HEAD: U08 hela A pa offset 3, oanvand. [FIRMWARE-ANDRING v2.2]
   MaxInputAmp            = scalar, U16,   8, "A", 0.01, 0, 0, 15, 2
   ; Duty-tak 0..25 (OCR = steg x 10). Oforandrad typ, ny offset 10 (HEAD 5).
   MaxPWM                 = scalar, U08,  10, "steps", 1, 0, 0, 25, 0
   ; Lagsta on-duty. Oforandrad typ, ny offset 11 (HEAD 6).
   MinPWM                 = scalar, U08,  11, "steps", 1, 0, 0, 25, 0
   ; MOSFET-temp over detta = duty 0. 0 = av. Oforandrad typ, ny offset 12 (HEAD 7).
   MaxTemp                = scalar, U08,  12, "°C", 1, 0, 0, 125, 0
   ; Mjukstart per PWM-steg (x10 ms). Ny offset 13 (HEAD 8). [lagras i HEAD men anvands inte - v2 ska anvanda]
   accelerationDelay      = scalar, U08,  13, "ms", 10, 0, 0, 2550, 0
   ; Temp-kurva x-axel (ADC/4). Ny offset 14 (HEAD 9). [lagras i HEAD men anvands inte - v2 ska anvanda]
   mosfetTempADCTable     = array,  U08,  14, [12], "ADC/4", 1, 0, 0, 255, 0
   ; Temp-kurva y-axel. Ny offset 26 (HEAD 21). [lagras i HEAD men anvands inte - v2 ska anvanda]
   mosfetTempTable        = array,  S08,  26, [12], "°C", 1, 0, -40, 127, 0

   ; ---------------- Sida 2: Start och manuell stegtabell (84 byte)  - fran v2.1
   page = 2
   ; NY: Hur laddningen startar.
   startMode              = bits,   U08,   0, [0:1], "Manual (Start button)", "Auto when battery connected", "Timer (delayed start)", "INVALID"
   ; NY: Fran overvakning: starta om fran bulk nar spanningen < eff_restartVolt.
   restartMode            = bits,   U08,   0, [2:2], "No restart", "Restart on voltage drop"
   ; NY: Tidsstyrd start: fordrojning i minuter (startMode = Timer).
   startDelayMin          = scalar, U16,   2, "min", 1, 0, 0, 1440, 0
   ; NY: Steg 1: metod.
   s1_method              = bits,   U08,   4, [0:1], "Constant current (CC)", "Constant voltage (CV)", "Monitor", "Off"
   ; NY: Steg 1: vad som hander nar ett avslutsvillkor uppfylls.
   s1_onEnd               = bits,   U08,   4, [2:3], "Next stage", "Go to stage 1", "Stop (done)", "Stop with error"
   ; NY: Steg 1: avsluta om batteritemp over.
   s1_tempMax             = scalar, S08,   5, "°C", 1, 0, -40, 80, 0
   ; NY: Steg 1: strom (CC-borvarde / CV-strombegransning).
   s1_current             = scalar, U16,   6, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 1: spanning (CV-borvarde / CC-spanningstak).
   s1_volt                = scalar, U16,   8, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 1: avsluta nar U >= (0 = av).
   s1_endVoltMax          = scalar, U16,  10, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 1: avsluta nar U <= (0 = av; Monitor -> omstart).
   s1_endVoltMin          = scalar, U16,  12, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 1: avsluta nar I >= (0 = av).
   s1_endAmpMax           = scalar, U16,  14, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 1: avsluta nar I <= (CV-slut, 0 = av).
   s1_endAmpMin           = scalar, U16,  16, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 1: maxtid (0 = obegransad).
   s1_maxTime             = scalar, U16,  18, "min", 1, 0, 0, 6000, 0
   ; NY: Steg 1: minsta tid innan avslut tillats.
   s1_minTime             = scalar, U16,  20, "s", 1, 0, 0, 65535, 0
   ; NY: Steg 1: avsluta/vanta om batteritemp under.
   s1_tempMin             = scalar, S08,  22, "°C", 1, 0, -40, 60, 0
   ; NY: Steg 1: avsluta efter x % av kapaciteten (0 = av).
   s1_endAhPct            = scalar, U08,  23, "%", 1, 0, 0, 200, 0
   ; NY: Steg 2: metod.
   s2_method              = bits,   U08,  24, [0:1], "Constant current (CC)", "Constant voltage (CV)", "Monitor", "Off"
   ; NY: Steg 2: vad som hander nar ett avslutsvillkor uppfylls.
   s2_onEnd               = bits,   U08,  24, [2:3], "Next stage", "Go to stage 1", "Stop (done)", "Stop with error"
   ; NY: Steg 2: avsluta om batteritemp over.
   s2_tempMax             = scalar, S08,  25, "°C", 1, 0, -40, 80, 0
   ; NY: Steg 2: strom (CC-borvarde / CV-strombegransning).
   s2_current             = scalar, U16,  26, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 2: spanning (CV-borvarde / CC-spanningstak).
   s2_volt                = scalar, U16,  28, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 2: avsluta nar U >= (0 = av).
   s2_endVoltMax          = scalar, U16,  30, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 2: avsluta nar U <= (0 = av; Monitor -> omstart).
   s2_endVoltMin          = scalar, U16,  32, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 2: avsluta nar I >= (0 = av).
   s2_endAmpMax           = scalar, U16,  34, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 2: avsluta nar I <= (CV-slut, 0 = av).
   s2_endAmpMin           = scalar, U16,  36, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 2: maxtid (0 = obegransad).
   s2_maxTime             = scalar, U16,  38, "min", 1, 0, 0, 6000, 0
   ; NY: Steg 2: minsta tid innan avslut tillats.
   s2_minTime             = scalar, U16,  40, "s", 1, 0, 0, 65535, 0
   ; NY: Steg 2: avsluta/vanta om batteritemp under.
   s2_tempMin             = scalar, S08,  42, "°C", 1, 0, -40, 60, 0
   ; NY: Steg 2: avsluta efter x % av kapaciteten (0 = av).
   s2_endAhPct            = scalar, U08,  43, "%", 1, 0, 0, 200, 0
   ; NY: Steg 3: metod.
   s3_method              = bits,   U08,  44, [0:1], "Constant current (CC)", "Constant voltage (CV)", "Monitor", "Off"
   ; NY: Steg 3: vad som hander nar ett avslutsvillkor uppfylls.
   s3_onEnd               = bits,   U08,  44, [2:3], "Next stage", "Go to stage 1", "Stop (done)", "Stop with error"
   ; NY: Steg 3: avsluta om batteritemp over.
   s3_tempMax             = scalar, S08,  45, "°C", 1, 0, -40, 80, 0
   ; NY: Steg 3: strom (CC-borvarde / CV-strombegransning).
   s3_current             = scalar, U16,  46, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 3: spanning (CV-borvarde / CC-spanningstak).
   s3_volt                = scalar, U16,  48, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 3: avsluta nar U >= (0 = av).
   s3_endVoltMax          = scalar, U16,  50, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 3: avsluta nar U <= (0 = av; Monitor -> omstart).
   s3_endVoltMin          = scalar, U16,  52, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 3: avsluta nar I >= (0 = av).
   s3_endAmpMax           = scalar, U16,  54, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 3: avsluta nar I <= (CV-slut, 0 = av).
   s3_endAmpMin           = scalar, U16,  56, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 3: maxtid (0 = obegransad).
   s3_maxTime             = scalar, U16,  58, "min", 1, 0, 0, 6000, 0
   ; NY: Steg 3: minsta tid innan avslut tillats.
   s3_minTime             = scalar, U16,  60, "s", 1, 0, 0, 65535, 0
   ; NY: Steg 3: avsluta/vanta om batteritemp under.
   s3_tempMin             = scalar, S08,  62, "°C", 1, 0, -40, 60, 0
   ; NY: Steg 3: avsluta efter x % av kapaciteten (0 = av).
   s3_endAhPct            = scalar, U08,  63, "%", 1, 0, 0, 200, 0
   ; NY: Steg 4: metod.
   s4_method              = bits,   U08,  64, [0:1], "Constant current (CC)", "Constant voltage (CV)", "Monitor", "Off"
   ; NY: Steg 4: vad som hander nar ett avslutsvillkor uppfylls.
   s4_onEnd               = bits,   U08,  64, [2:3], "Next stage", "Go to stage 1", "Stop (done)", "Stop with error"
   ; NY: Steg 4: avsluta om batteritemp over.
   s4_tempMax             = scalar, S08,  65, "°C", 1, 0, -40, 80, 0
   ; NY: Steg 4: strom (CC-borvarde / CV-strombegransning).
   s4_current             = scalar, U16,  66, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 4: spanning (CV-borvarde / CC-spanningstak).
   s4_volt                = scalar, U16,  68, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 4: avsluta nar U >= (0 = av).
   s4_endVoltMax          = scalar, U16,  70, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 4: avsluta nar U <= (0 = av; Monitor -> omstart).
   s4_endVoltMin          = scalar, U16,  72, "V", 0.01, 0, 0, 55, 2
   ; NY: Steg 4: avsluta nar I >= (0 = av).
   s4_endAmpMax           = scalar, U16,  74, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 4: avsluta nar I <= (CV-slut, 0 = av).
   s4_endAmpMin           = scalar, U16,  76, "A", 0.01, 0, 0, 15, 2
   ; NY: Steg 4: maxtid (0 = obegransad).
   s4_maxTime             = scalar, U16,  78, "min", 1, 0, 0, 6000, 0
   ; NY: Steg 4: minsta tid innan avslut tillats.
   s4_minTime             = scalar, U16,  80, "s", 1, 0, 0, 65535, 0
   ; NY: Steg 4: avsluta/vanta om batteritemp under.
   s4_tempMin             = scalar, S08,  82, "°C", 1, 0, -40, 60, 0
   ; NY: Steg 4: avsluta efter x % av kapaciteten (0 = av).
   s4_endAhPct            = scalar, U08,  83, "%", 1, 0, 0, 200, 0

   ; ---------------- Sida 3: Skydd, drivsteg och kalibrering (38 byte)  - fran v2.1
   page = 3
   ; NY: PWM-frekvens. Firmware valjer narmaste mojliga (timer-prescaler).
   pwmFreqKHz             = scalar, U08,   0, "kHz", 1, 0, 1, 100, 0
   ; NY: Mjukstart: tid fran 0 till borvarde.
   softStartMs            = scalar, U16,   1, "ms", 1, 0, 0, 10000, 0
   ; NY: Max PWM-andring per regler-varv.
   dutyStepMax            = scalar, U08,   3, "steps", 1, 0, 1, 25, 0
   ; NY: Gate-drivspanning under detta = fel 5 (MOSFET leder daligt).
   driverVoltMin          = scalar, U08,   4, "V", 0.1, 0, 0, 16, 1
   ; NY: Gate-drivspanning over detta = fel 6.
   driverVoltMax          = scalar, U08,   5, "V", 0.1, 0, 0, 16, 1
   ; NY: MOSFET-tempsensor.
   mosfetTempSensor       = bits,   U08,   6, [0:1], "None", "DS18B20 (not active)", "NTC table (not active)", "INVALID"
   ; NY: Batteritempsensor.
   batTempSensor          = bits,   U08,   6, [2:3], "None", "DS18B20 (not active)", "NTC table (not active)", "INVALID"
   ; NY: Typ av strommsensor (ger skala).
   currentSensor          = bits,   U08,   6, [4:5], "ACS712-05B (5 A)", "ACS712-20A (20 A)", "ACS712-30A (30 A)", "Shunt + amplifier (not supported)"
   ; NY: Nollstall strommsensorn vid start.
   ampZeroAtBoot          = bits,   U08,   6, [6:6], "No", "Yes (output off while zeroing)"
   ; NY: Instromsgivare monterad? Styr om inPower/forlust/verkningsgrad beraknas.
   inAmpSensor            = bits,   U08,   6, [7:7], "None (efficiency not shown)", "Fitted (input current measured)"
   ; NY: MOSFET-temp dar deratering borjar (kurva pa sida 4).
   derateStartTemp        = scalar, S08,   7, "°C", 1, 0, 0, 125, 0
   ; NY: Hysteres innan aterstart efter overtemp.
   tempHyst               = scalar, U08,   8, "°C", 1, 0, 0, 30, 0
   ; NY: Inspanning under detta = fel 3 (0 = av).
   minInputVolt           = scalar, U16,   9, "V", 0.01, 0, 0, 65, 2
   ; NY: Strom-aterstallning: vantetid efter begransning innan strommen trappas upp igen.
   currentRestoreMs       = scalar, U16,  11, "ms", 1, 0, 0, 60000, 0
   ; NY: Strom-aterstallning: PWM-steg per uppstegning.
   currentRestoreStep     = scalar, U08,  13, "steps", 1, 0, 1, 25, 0
   ; NY: Antal automatiska omstarter efter fel (0 = alltid manuell).
   faultRetryCount        = scalar, U08,  14, "", 1, 0, 0, 10, 0
   ; NY: Vantetid fore automatisk omstart.
   faultRetryDelay        = scalar, U08,  15, "s", 1, 0, 0, 255, 0
   ; NY: Diagnoslage. Ska INTE sparas till EEPROM (alltid Normal efter omstart).
   diagMode               = bits,   U08,  16, [0:1], "Normal", "Diagnostics: fixed duty (not active, output off)", "Diagnostics: measure only (output off)", "INVALID"
   ; NY: Fast duty i diagnoslage 1. Skydden (V/A/temp) ar fortfarande aktiva.
   diagDuty               = scalar, U08,  17, "steps", 1, 0, 0, 25, 0
   ; NY: Kalibrering kanal OutputVolt: skalfaktor (matt = ra x skala + offset).
   calOutVoltScale        = scalar, U16,  18, "", 0.0001, 0, 0.5, 1.5, 4
   ; NY: Kalibrering kanal OutputVolt: offset.
   calOutVoltOffset       = scalar, S16,  20, "V", 0.01, 0, -5, 5, 2
   ; NY: Kalibrering kanal InputVolt: skalfaktor (matt = ra x skala + offset).
   calInVoltScale         = scalar, U16,  22, "", 0.0001, 0, 0.5, 1.5, 4
   ; NY: Kalibrering kanal InputVolt: offset.
   calInVoltOffset        = scalar, S16,  24, "V", 0.01, 0, -5, 5, 2
   ; NY: Kalibrering kanal OutputAmp: skalfaktor (matt = ra x skala + offset).
   calOutAmpScale         = scalar, U16,  26, "", 0.0001, 0, 0.5, 1.5, 4
   ; NY: Kalibrering kanal OutputAmp: offset.
   calOutAmpOffset        = scalar, S16,  28, "A", 0.001, 0, -5, 5, 3
   ; NY: Kalibrering kanal InputAmp: skalfaktor (matt = ra x skala + offset).
   calInAmpScale          = scalar, U16,  30, "", 0.0001, 0, 0.5, 1.5, 4
   ; NY: Kalibrering kanal InputAmp: offset.
   calInAmpOffset         = scalar, S16,  32, "A", 0.001, 0, -5, 5, 3
   ; NY: Kalibrering kanal MosfetDriverVolt: skalfaktor (matt = ra x skala + offset).
   calDriverScale         = scalar, U16,  34, "", 0.0001, 0, 0.5, 1.5, 4
   ; NY: Kalibrering kanal MosfetDriverVolt: offset.
   calDriverOffset        = scalar, S16,  36, "V", 0.01, 0, -5, 5, 2

   ; ---------------- Sida 4: Tabeller (68 byte)
   page = 4
   ; NY: Batteri-NTC: ADC-varden (10 bit).
   batNtcADC              = array,  U16,   0, [12], "ADC", 1, 0, 0, 1023, 0
   ; NY: Batteri-NTC: temperatur per ADC-punkt.
   batNtcTemp             = array,  S08,  24, [12], "°C", 1, 0, -40, 127, 0
   ; NY: Deratering: MOSFET-temp-punkter.
   derateTempBins         = array,  S08,  36, [6], "°C", 1, 0, 0, 125, 0
   ; NY: Deratering: tillaten strom i % av borvarde.
   deratePct              = array,  U08,  42, [6], "%", 1, 0, 0, 100, 0
   ; NY: Tid-strom-skydd: tid over kontinuerlig grans.
   ampTimeBins            = array,  U16,  48, [5], "s", 1, 0, 0, 65535, 0
   ; NY: Tid-strom-skydd: tillaten utstrom vid respektive tid.
   ampTimeLimit           = array,  U16,  58, [5], "A", 0.01, 0, 0, 15, 2

   ; ---------------- Sida 5: Autolage (typ + Ah) (64 byte)  - fran v2.1 (autolage)
   page = 5
   ; NY: Laddlage. Auto = firmware raknar alla parametrar fran batterityp och Ah (varje parameter kan overstyras).
   chargeMode             = bits,   U08,   0, [0:1], "Auto (type + Ah)", "Manual stage table s1-s4 (not active)", "Simple CC/CV (charger max values)", "INVALID"
   ; NY: Temperaturkompensering av absorption/float (ref 25 C). Utan givare: ingen kompensering + varning.
   tempCompEnable         = bits,   U08,   0, [2:2], "Off", "On - NOT ACTIVE, NO EFFECT (no battery temp sensor)"
   ; NY: Batterityp - valjer rad i typtabellen. Anpassad = inga autovarden, alla man_* anvands.
   batteryType            = bits,   U08,   1, [0:2], "Lead flooded starter (SLI)", "Lead AGM", "Lead GEL", "Lead flooded deep cycle", "Lead calcium/EFB", "LiFePO4 (unconfirmed)", "Custom (manual)", "INVALID"
   ; NY: Nominell batterispanning - ger cellantal (bly 2 V/cell, LiFePO4 3,2 V/cell).
   batteryNomVolt         = bits,   U08,   1, [3:5], "6 V", "12 V", "24 V", "36 V", "INVALID", "INVALID", "INVALID", "INVALID"
   ; NY: Batteriets kapacitet C (20 h-varde). Det enda som MASTE anges i Auto.
   capacityAh             = scalar, U16,   2, "Ah", 0.1, 0, 0, 1000, 1
   ; NY: Strom-tak i Auto. Effektivt tak = min(detta, 15 A hardvarutak, MaxChargeAmp, givarens matomrade).
   autoAmpCap             = scalar, U16,   4, "A", 0.01, 0, 0, 15, 2
   ; NY: Golv for slut-, float- och forladdningsstrom (ACS712 osaker under ca 0,5 A).
   tailAmpFloor           = scalar, U16,   6, "A", 0.01, 0, 0, 5, 2
   ; NY: Kalla for cellCount: Auto = beraknat, Manuell = man_cellCount.
   ovr_cellCount          = bits,   U08,   8, [0:0], "Auto", "Manuell"
   ; NY: Kalla for bulkAmp: Auto = beraknat, Manuell = man_bulkAmp.
   ovr_bulkAmp            = bits,   U08,   8, [1:1], "Auto", "Manuell"
   ; NY: Kalla for absorbVolt: Auto = beraknat, Manuell = man_absorbVolt.
   ovr_absorbVolt         = bits,   U08,   8, [2:2], "Auto", "Manuell"
   ; NY: Kalla for floatVolt: Auto = beraknat, Manuell = man_floatVolt.
   ovr_floatVolt          = bits,   U08,   8, [3:3], "Auto", "Manuell"
   ; NY: Kalla for tailAmp: Auto = beraknat, Manuell = man_tailAmp.
   ovr_tailAmp            = bits,   U08,   8, [4:4], "Auto", "Manuell"
   ; NY: Kalla for floatAmp: Auto = beraknat, Manuell = man_floatAmp.
   ovr_floatAmp           = bits,   U08,   8, [5:5], "Auto", "Manuell"
   ; NY: Kalla for bulkMaxTime: Auto = beraknat, Manuell = man_bulkMaxTime.
   ovr_bulkMaxTime        = bits,   U08,   8, [6:6], "Auto", "Manuell"
   ; NY: Kalla for bulkAhPct: Auto = beraknat, Manuell = man_bulkAhPct.
   ovr_bulkAhPct          = bits,   U08,   8, [7:7], "Auto", "Manuell"
   ; NY: Kalla for absorbMaxTime: Auto = beraknat, Manuell = man_absorbMaxTime.
   ovr_absorbMaxTime      = bits,   U08,   9, [0:0], "Auto", "Manuell"
   ; NY: Kalla for absorbMinTime: Auto = beraknat, Manuell = man_absorbMinTime.
   ovr_absorbMinTime      = bits,   U08,   9, [1:1], "Auto", "Manuell"
   ; NY: Kalla for floatMaxTime: Auto = beraknat, Manuell = man_floatMaxTime.
   ovr_floatMaxTime       = bits,   U08,   9, [2:2], "Auto", "Manuell"
   ; NY: Kalla for restartVolt: Auto = beraknat, Manuell = man_restartVolt.
   ovr_restartVolt        = bits,   U08,   9, [3:3], "Auto", "Manuell"
   ; NY: Kalla for tempCompMv: Auto = beraknat, Manuell = man_tempCompMv.
   ovr_tempCompMv         = bits,   U08,   9, [4:4], "Auto", "Manuell"
   ; NY: Kalla for chargeTempMin: Auto = beraknat, Manuell = man_chargeTempMin.
   ovr_chargeTempMin      = bits,   U08,   9, [5:5], "Auto", "Manuell"
   ; NY: Kalla for chargeTempMax: Auto = beraknat, Manuell = man_chargeTempMax.
   ovr_chargeTempMax      = bits,   U08,   9, [6:6], "Auto", "Manuell"
   ; NY: Kalla for prechargeVolt: Auto = beraknat, Manuell = man_prechargeVolt.
   ovr_prechargeVolt      = bits,   U08,   9, [7:7], "Auto", "Manuell"
   ; NY: Kalla for prechargeAmp: Auto = beraknat, Manuell = man_prechargeAmp.
   ovr_prechargeAmp       = bits,   U08,  10, [0:0], "Auto", "Manuell"
   ; NY: Kalla for prechargeMaxTime: Auto = beraknat, Manuell = man_prechargeMaxTime.
   ovr_prechargeMaxTime   = bits,   U08,  10, [1:1], "Auto", "Manuell"
   ; NY: Kalla for voltLimit: Auto = beraknat, Manuell = man_voltLimit.
   ovr_voltLimit          = bits,   U08,  10, [2:2], "Auto", "Manuell"
   ; NY: Kalla for totalMaxTime: Auto = beraknat, Manuell = man_totalMaxTime.
   ovr_totalMaxTime       = bits,   U08,  10, [3:3], "Auto", "Manuell"
   ; NY: Kalla for batteryPresentVolt: Auto = beraknat, Manuell = man_batteryPresentVolt.
   ovr_batteryPresentVolt = bits,   U08,  10, [4:4], "Auto", "Manuell"
   ; NY: Manuellt varde: Antal celler i serie (anvands nar ovr_cellCount = Manuell eller typ = Anpassad).
   man_cellCount          = scalar, U08,  12, "cells", 1, 0, 1, 32, 0
   ; NY: Manuellt varde: Laddstrom bulk (CC) = min(C-rate x Ah, tak) (anvands nar ovr_bulkAmp = Manuell eller typ = Anpassad).
   man_bulkAmp            = scalar, U16,  13, "A", 0.01, 0, 0, 15, 2
   ; NY: Manuellt varde: Absorptionsspanning vid 25 °C (anvands nar ovr_absorbVolt = Manuell eller typ = Anpassad).
   man_absorbVolt         = scalar, U16,  15, "V", 0.01, 0, 0, 55, 2
   ; NY: Manuellt varde: Floatspanning vid 25 °C (anvands nar ovr_floatVolt = Manuell eller typ = Anpassad).
   man_floatVolt          = scalar, U16,  17, "V", 0.01, 0, 0, 55, 2
   ; NY: Manuellt varde: Slutstrom absorption = max(% x Ah, golv), 0 = bara tid (anvands nar ovr_tailAmp = Manuell eller typ = Anpassad).
   man_tailAmp            = scalar, U16,  19, "A", 0.01, 0, 0, 15, 2
   ; NY: Manuellt varde: Max strom i float = 0,05C (<= bulk) (anvands nar ovr_floatAmp = Manuell eller typ = Anpassad).
   man_floatAmp           = scalar, U16,  21, "A", 0.01, 0, 0, 15, 2
   ; NY: Manuellt varde: Max tid bulk (1,2 x C / I), overskridning = FEL (anvands nar ovr_bulkMaxTime = Manuell eller typ = Anpassad).
   man_bulkMaxTime        = scalar, U16,  23, "min", 1, 0, 0, 6000, 0
   ; NY: Manuellt varde: Max laddad Ah i bulk, % av C (0 = av) (anvands nar ovr_bulkAhPct = Manuell eller typ = Anpassad).
   man_bulkAhPct          = scalar, U08,  25, "%", 1, 0, 0, 250, 0
   ; NY: Manuellt varde: Max tid absorption (anvands nar ovr_absorbMaxTime = Manuell eller typ = Anpassad).
   man_absorbMaxTime      = scalar, U16,  26, "min", 1, 0, 0, 6000, 0
   ; NY: Manuellt varde: Slutstrom maste hallas sa lange (anvands nar ovr_absorbMinTime = Manuell eller typ = Anpassad).
   man_absorbMinTime      = scalar, U16,  28, "s", 1, 0, 0, 3600, 0
   ; NY: Manuellt varde: Max tid float (0 = obegransad), sedan overvakning (anvands nar ovr_floatMaxTime = Manuell eller typ = Anpassad).
   man_floatMaxTime       = scalar, U16,  30, "min", 1, 0, 0, 10080, 0
   ; NY: Manuellt varde: Omstart fran overvakning under denna (anvands nar ovr_restartVolt = Manuell eller typ = Anpassad).
   man_restartVolt        = scalar, U16,  32, "V", 0.01, 0, 0, 55, 2
   ; NY: Manuellt varde: Temperaturkompensering per cell (anvands nar ovr_tempCompMv = Manuell eller typ = Anpassad).
   man_tempCompMv         = scalar, S08,  34, "mV/°C/cell", 0.1, 0, -10, 0, 1
   ; NY: Manuellt varde: Laddning tillaten fran (anvands nar ovr_chargeTempMin = Manuell eller typ = Anpassad).
   man_chargeTempMin      = scalar, S08,  35, "°C", 1, 0, -40, 60, 0
   ; NY: Manuellt varde: Laddning tillaten till (anvands nar ovr_chargeTempMax = Manuell eller typ = Anpassad).
   man_chargeTempMax      = scalar, S08,  36, "°C", 1, 0, 0, 80, 0
   ; NY: Manuellt varde: Forladdning (lag strom) under denna (anvands nar ovr_prechargeVolt = Manuell eller typ = Anpassad).
   man_prechargeVolt      = scalar, U16,  37, "V", 0.01, 0, 0, 55, 2
   ; NY: Manuellt varde: Forladdningsstrom = max(0,03C, golv) <= bulk (anvands nar ovr_prechargeAmp = Manuell eller typ = Anpassad).
   man_prechargeAmp       = scalar, U16,  39, "A", 0.01, 0, 0, 15, 2
   ; NY: Manuellt varde: Forladdningsgransen maste passeras inom, annars FEL (anvands nar ovr_prechargeMaxTime = Manuell eller typ = Anpassad).
   man_prechargeMaxTime   = scalar, U16,  41, "min", 1, 0, 0, 1440, 0
   ; NY: Manuellt varde: Hogsta tillatna utspanning efter kompensering (anvands nar ovr_voltLimit = Manuell eller typ = Anpassad).
   man_voltLimit          = scalar, U16,  43, "V", 0.01, 0, 0, 55, 2
   ; NY: Manuellt varde: Total max-tid forladdning+bulk+absorption+float (v2.2: float raknas in, max 10080) (anvands nar ovr_totalMaxTime = Manuell eller typ = Anpassad).
   man_totalMaxTime       = scalar, U16,  45, "min", 1, 0, 0, 10080, 0
   ; NY: Manuellt varde: Batteri anslutet over denna (anvands nar ovr_batteryPresentVolt = Manuell eller typ = Anpassad).
   man_batteryPresentVolt = scalar, U16,  47, "V", 0.01, 0, 0, 55, 2
   ; NY: Reserv for framtida autoparametrar (ska vara 0).
   autoReserved           = array,  U08,  49, [15], "", 1, 0, 0, 255, 0

