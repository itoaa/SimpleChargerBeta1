; TEMPORARY TunerStudio ini.
; Replace this file when the original ini is found.
; Do not change the firmware struct layout and this file independently.
;
; Signature must match the firmware query string, including two trailing spaces.
; Command Q returns that signature.
; Command S returns the revision text (versionInfo below).
; Command F returns protocol "001". TunerStudio has no separate protocol slot, so this ini does not send F.
; Command A returns the 11-byte realtime block. No offset and no count.
; Command V returns the 33-byte page. No offset and no count.
; Command W is one offset byte, then one value byte. %o is one byte. Do not use %2o.
; Command X is one offset byte, one count byte, then that many data bytes.
; Command B is accepted and does not burn EEPROM.
; Commands c and C return the seconds byte. They are not ini commands.
; int8 channels are scaled so the gauge never claims a count above 127.
; MOSFET temperature type 2 is DS18B20 / OneWire, and OneWire is not in this build.

[TunerStudio]
   iniSpecVersion = 3.43
   signature      = "MSII s-Charger B-1  "
   queryCommand   = "Q"
   versionInfo    = "S"

[Constants]
   endianness       = big
   nPages           = 1
   pageSize         = 33
   pageIdentifier   = ""
   burnCommand      = "B"
   pageReadCommand  = "V"
   pageValueWrite   = "W%o%v"
   pageChunkWrite   = "X%o%c%v"
   blockingFactor   = 33

   page = 1
   ; Stored settings. This firmware does not run a charge regulator from them.
   ChargeAmp          = scalar, U08,  0, "",    1, 0, 0, 255, 0
   MaxChargeAmp       = scalar, U08,  1, "",    1, 0, 0, 255, 0
   MaxChargeVolt      = scalar, U08,  2, "",    1, 0, 0, 255, 0
   MaxInputAmp        = scalar, U08,  3, "",    1, 0, 0, 255, 0
   MaxInputVolt       = scalar, U08,  4, "",    1, 0, 0, 255, 0
   ; Firmware default is 5. setDuty() writes OCR = duty * 10, so 5 is a small duty (OCR 50), not 50 or 100.
   ; 25 is full scale on the 8-bit PWM top (25 * 10 = 250).
   MaxPWM             = scalar, U08,  5, "duty", 1, 0, 0, 25, 0
   MinPWM             = scalar, U08,  6, "duty", 1, 0, 0, 25, 0
   MaxTemp            = scalar, U08,  7, "C",    1, 0, 0, 255, 0
   accelerationDelay  = scalar, U08,  8, "",    1, 0, 0, 255, 0
   mosfetTempADCTable = array,  U08,  9, [12], "ADC", 1, 0, 0, 255, 0
   ; int8 table. Do not set a limit above 127.
   mosfetTempTable    = array,  S08, 21, [12], "C",   1, 0, -40, 127, 0

[ConstantsExtensions]
   defaultValue = MaxPWM, 5

[OutputChannels]
   ochBlockSize  = 11
   ochGetCommand = "A"

   seconds            = scalar, U08,  0, "s", 1.0, 0.0
   pulseWidth         = scalar, U08,  1, "duty", 1.0, 0.0
   ; No RPM sensor. Left at 0.
   unusedRpm          = scalar, U08,  2, "", 1.0, 0.0
   ; No TPS sensor. Left at 0.
   throttlePosition   = scalar, U08,  3, "", 1.0, 0.0
   ; Milliamps / 100, then the absolute value. 10 counts = 1.0 A. int8 stops at 12.7 A.
   InputAmp           = scalar, S08,  4, "A", 0.1, 0.0
   ; Whole volts from the divider. int8 stops at 127.
   InputVolt          = scalar, S08,  5, "V", 1.0, 0.0
   OutputAmp          = scalar, S08,  6, "A", 0.1, 0.0
   OutputVolt         = scalar, S08,  7, "V", 1.0, 0.0
   ; Not measured yet. Type 2 is DS18B20 / OneWire, which is not linked.
   MosfetTempCor      = scalar, S08,  8, "C", 1.0, 0.0
   MosfetTempADC      = scalar, S08,  9, "C", 1.0, 0.0
   ; 12 V rail on Pin12V. 0.1 V per count, full scale 20.1 V. int8 stops at 12.7 V.
   MosfetDriverVolt   = scalar, S08, 10, "V", 0.1, 0.0

[GaugeConfigurations]
   gaugeCategory = "Charger"
   inputVoltGauge    = InputVolt,        "Input voltage",  "V",    0, 65,   0, 10, 60, 65,   1, 0
   outputVoltGauge   = OutputVolt,       "Output voltage", "V",    0, 55,   0, 10, 50, 55,   1, 0
   inputAmpGauge     = InputAmp,         "Input current",  "A",    0, 12.7, 0, 0,  10, 12.7, 1, 1
   outputAmpGauge    = OutputAmp,        "Output current", "A",    0, 12.7, 0, 0,  10, 12.7, 1, 1
   driverVoltGauge   = MosfetDriverVolt, "12 V rail",      "V",    0, 12.7, 9, 10, 12, 12.7, 1, 1
   pulseWidthGauge   = pulseWidth,       "PWM duty",       "duty", 0, 25,   0, 0,  20, 25,   0, 0
   secondsGauge      = seconds,          "Seconds",        "s",    0, 255,  0, 0,  255, 255, 0, 0

   gaugeCategory = "Not measured"
   mosfetTempGauge    = MosfetTempCor,    "MOSFET temp, not measured",     "C", -40, 127, -40, 0, 80, 100, 0, 0
   mosfetTempAdcGauge = MosfetTempADC,    "MOSFET temp ADC, not measured", "C", -40, 127, -40, 0, 80, 100, 0, 0
   unusedRpmGauge     = unusedRpm,        "RPM, no sensor",                "",  0,   255, 0,   0, 255, 255, 0, 0
   throttleGauge      = throttlePosition, "Throttle, no sensor",           "",  0,   255, 0,   0, 255, 255, 0, 0

[FrontPage]
   gauge1 = inputVoltGauge
   gauge2 = outputVoltGauge
   gauge3 = inputAmpGauge
   gauge4 = outputAmpGauge
   gauge5 = driverVoltGauge
   gauge6 = pulseWidthGauge

[UserDefined]
   dialog = chargeSettings, "Charge settings"
      field = "Charge current limit", ChargeAmp
      field = "Max charge current",   MaxChargeAmp
      field = "Max charge voltage",   MaxChargeVolt
      field = "Max input current",    MaxInputAmp
      field = "Max input voltage",    MaxInputVolt
      field = "Max PWM duty",         MaxPWM
      field = "Min PWM duty",         MinPWM
      field = "Max temperature",      MaxTemp
      field = "Acceleration delay",   accelerationDelay

   dialog = mosfetTempCurveDialog, "MOSFET temperature table, not used yet"
      panel = mosfetTempCurve, Center

[CurveEditor]
   curve = mosfetTempCurve, "MOSFET temperature table, not used yet"
      columnLabel = "ADC", "deg C"
      xAxis       = 0, 255, 4
      yAxis       = -40, 127, 4
      xBins       = mosfetTempADCTable
      yBins       = mosfetTempTable

[Menu]
   menuDialog = main
   menu = "Charger"
      subMenu = chargeSettings, "Charge settings"
      subMenu = mosfetTempCurveDialog, "MOSFET temperature table"

[Datalog]
   entry = seconds,          "Seconds",        int,   "%d"
   entry = pulseWidth,       "PWM duty",       int,   "%d"
   entry = InputAmp,         "Input current",  float, "%.1f"
   entry = InputVolt,        "Input voltage",  float, "%.0f"
   entry = OutputAmp,        "Output current", float, "%.1f"
   entry = OutputVolt,       "Output voltage", float, "%.0f"
   entry = MosfetDriverVolt, "12 V rail",      float, "%.1f"
   entry = MosfetTempCor,    "MOSFET temp, not measured", int, "%d"
   entry = MosfetTempADC,    "MOSFET temp ADC, not measured", int, "%d"
   entry = unusedRpm,        "RPM, no sensor", int, "%d"
   entry = throttlePosition, "Throttle, no sensor", int, "%d"
