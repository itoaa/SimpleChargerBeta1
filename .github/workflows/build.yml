name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  host-tests:
    # Vardtester for EEPROM-modulen (TunerStudio v2.2). Bygger inte firmware och committar inget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run host tests
        # Inkluderar golden-vektorer fran test/ref/auto_params_v2.2.py (python3).
        run: make -C SimpleChargerBeta1/test test

  avr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SimpleChargerBeta1
    steps:
      - uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr make

      - name: Build
        run: make all

      - name: Create hex
        run: avr-objcopy -O ihex -R .eeprom charger.elf charger.hex

      - name: Size limits (flash < 28 kB, statiskt RAM < 1,2 kB)
        run: avr-size -B charger.elf && sh tools/check_size.sh charger.elf

      - uses: actions/upload-artifact@v4
        with:
          name: charger
          path: |
            SimpleChargerBeta1/charger.elf
            SimpleChargerBeta1/charger.hex

      - name: Commit firmware
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f charger.elf charger.hex
          if git diff --staged --quiet; then
            echo "Firmware unchanged"
          else
            git commit -m "Build charger firmware [skip ci]"
            git push
          fi
